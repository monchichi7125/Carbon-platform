  /* ---------- 智能问答知识（供 01 政策模块问答工具使用） ---------- */
  policy:{ qa:[{q:"什么是碳达峰", a:"碳达峰指二氧化碳年排放量达到历史最高值后进入平台期并持续下降的拐点，是碳中和过程的关键节点。"},{q:"什么是碳中和", a:"碳中和指一定时期内人为碳排放被减排、碳汇、CCUS 等抵消，实现净零排放。"},{q:"碳交易怎么运作", a:"政府设定排放总量并发放配额，企业根据实际排放买卖配额，以最低成本完成减排。"},{q:"ccus 是什么", a:"CCUS 是碳捕集、利用与封存，针对钢铁、水泥等难减排行业实现深度脱碳。"},{q:"3060 目标", a:"中国力争 2030 年前碳达峰、2060 年前碳中和。"},{q:"碳汇", a:"森林、湿地、海洋等从大气中吸收并固定 CO₂ 的能力，是重要抵消手段。"},{q:"esg", a:"ESG 是环境、社会、治理三项非财务指标，双碳下「E（环境）」权重显著提升。"},{q:"绿电", a:"来自风、光、水、核等清洁电源、几乎不产生碳排放的电力，可通过绿证/绿电交易购买。"},{q:"CBAM", a:"CBAM 是欧盟碳边境调节机制，2026 年 1 月 1 日起正式实施，对进口高碳产品按隐含碳含量征收费用。"},{q:"CCER", a:"CCER 是国家核证自愿减排量，项目依据已发布方法学开发，经核证后可用于抵销部分配额清缴。"}] },

  /* ---------- 模块六：考核认证 ---------- */
  assess:{
    /* 阶段性综合测试：分阶段递进 */
    comprehensive:[
      {stage:"阶段一 · 基础达标", desc:"覆盖基础概念、术语与目标，检验入门掌握程度。", qs:[
        {id:"ca1", type:"choice", q:"实现碳中和最关键的源头性工程是？", options:["构建以新能源为主体的新型电力系统","扩大能源进口","增加运力","提高利率"], answer:0, explain:"能源系统清洁化替代是源头性、基础性工程，决定下游各领域的减排空间。"},
        {id:"ca2", type:"judge", q:"CBAM（碳边境调节机制）是欧盟推动的碳关税类政策。", options:["正确","错误"], answer:0, explain:"CBAM 对相关进口产品按隐含碳含量征收费用，实质是碳关税安排。"},
        {id:"ca3", type:"choice", q:"下列哪个不属于可再生能源？", options:["风电","光伏","水电","煤电"], answer:3, explain:"煤电依赖化石燃料且不可再生，是碳排放的主要来源之一。"},
        {id:"ca4", type:"judge", q:"林业碳汇项目经核证后可在碳市场交易获得收益。", options:["正确","错误"], answer:0, explain:"符合条件的林业碳汇（如 CCER 造林碳汇）可交易，是生态产品价值实现路径。"},
        {id:"ca5", type:"choice", q:"碳交易实现低成本减排的本质是？", options:["通过买卖配额让减排成本低者多减","强制所有企业同比例减 50%","政府统一分配利润","禁止高排放企业生产"], answer:0, explain:"碳市场通过价格信号引导减排资源最优配置，以最低社会成本完成总量目标。"},
        {id:"ca6", type:"choice", q:"“两个替代”通常指？", options:["能源生产侧清洁替代 + 能源消费侧电能替代","进口替代 + 出口替代","人工替代 + 机器替代","煤炭替代 + 石油替代"], answer:0, explain:"清洁替代（发电端用清洁能源替代化石）与电能替代（用能端用电替代散煤/燃油）是双碳主路径。"},
        {id:"ca7", type:"choice", q:"个人碳足迹核算中，通常碳强度最高的是？", options:["长途航空出行","步行","骑行","乘坐地铁"], answer:0, explain:"航空单位人公里碳排放显著高于轨道交通与慢行交通，长途飞行是个人碳足迹的重要来源。"},
        {id:"ca8", type:"judge", q:"“碳达峰”意味着某个时点后碳排放量不再增长并开始下降。", options:["正确","错误"], answer:0, explain:"达峰即排放量达到历史峰值后进入下降通道，是碳中和的前置条件。"},
        {id:"ca9", type:"choice", q:"ESG 中的“E”在双碳背景下主要关注？", options:["企业环境表现与碳排放管理","员工娱乐活动","股东分红","市场占有率"], answer:0, explain:"E（Environment）关注能耗、排放、资源利用与气候风险，双碳下权重显著提升。"},
        {id:"ca10", type:"choice", q:"下列哪项属于有效的低碳生活方式？", options:["节能改造、公交出行、适度饮食","长期开空调不关","频繁购买快时尚新衣","长途独自自驾"], answer:0, explain:"节能、绿色出行与适度消费可显著降低个人碳足迹。"}
      ]},
      {stage:"阶段二 · 进阶综合", desc:"综合考查核算方法、市场机制、标准体系与行业路径。", qs:[
        {id:"cb1", type:"choice", q:"某企业核算发现范围二排放占比最高，最有效的短期减排措施是？", options:["采购绿电/绿证并推进节能改造","关闭财务部门","改用更多柴油发电机","停止所有生产"], answer:0, explain:"范围二来自外购电力，采购绿电绿证、提升能效与自建光伏是最直接的抓手。"},
        {id:"cb2", type:"choice", q:"采用“基准线法”分配配额时，企业的配额量主要取决于？", options:["行业基准值 × 实际产量（或供热/供电量）","企业注册资本","员工人数","厂房面积"], answer:0, explain:"基准线法按单位产品（或单位产出）的行业先进基准乘以产量分配，激励效率提升。"},
        {id:"cb3", type:"judge", q:"核算企业排放时，应优先选用实测值或国家公布的最新排放因子，而非随意取值。", options:["正确","错误"], answer:0, explain:"因子选取须遵循“实测优先、国家/区域因子次之、国际缺省值兜底”的层级原则，并注明来源与年份。"},
        {id:"cb4", type:"choice", q:"产品碳足迹（CFP）核算通常覆盖的边界是？", options:["从原材料获取到废弃处置的全生命周期（摇篮到坟墓）","仅生产车间用能","仅运输环节","仅销售环节"], answer:0, explain:"产品碳足迹强调全生命周期视角，涵盖原材料、生产、运输、使用与废弃各阶段。"},

let curGrid = "全国电网平均";
function buildFactors(){
  FACTORS = {}; GRID_FACTORS = {};
  EMISSION_FACTORS.forEach(f=>{
    FACTORS[f.name] = {v:f.factor, unit:f.unit, source:f.source, year:f.year, cat:f.cat};
    if(f.cat==="电力") GRID_FACTORS[f.name] = f.factor;
  });
}
buildFactors();
function gridFactor(){ return GRID_FACTORS[curGrid]!=null ? GRID_FACTORS[curGrid] : (FACTORS["电力"]?FACTORS["电力"].v:0.5703); }
function fetchFactors(){
  fetch("./emission-factors.json")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(arr=>{
      if(Array.isArray(arr) && arr.length){
        EMISSION_FACTORS.length=0; arr.forEach(x=>EMISSION_FACTORS.push(x)); buildFactors(); initVisual(); renderFactorTable();
        toast("已联网更新排放因子（"+EMISSION_FACTORS.length+" 条）");
      } else throw new Error("数据为空");
    })
    .catch(e=>{ toast("联网获取失败，继续使用内置权威因子（"+e.message+"）"); });
}
function onGridChange(){ const s=document.getElementById("gridSel"); if(s){ curGrid=s.value; calcEmission(); } }
function renderFactorTable(){
  const box=document.getElementById("factorTable"); if(!box) return;
  const cats={};
  EMISSION_FACTORS.forEach(f=>{ (cats[f.cat]=cats[f.cat]||[]).push(f); });
  let h="<table style='width:100%;border-collapse:collapse;font-size:13px'>";
  h+="<thead><tr style='background:#f3f8f6'><th style='text-align:left;padding:6px 8px'>类别</th><th style='text-align:left;padding:6px 8px'>名称</th><th style='text-align:right;padding:6px 8px'>因子</th><th style='text-align:left;padding:6px 8px'>单位</th><th style='text-align:left;padding:6px 8px'>来源 / 年份</th></tr></thead><tbody>";
  Object.keys(cats).forEach(c=>{
    cats[c].forEach((f,i)=>{
      h+=`<tr style='border-top:1px solid var(--line)'>
        <td style='padding:5px 8px'>${i===0?c:""}</td>
        <td style='padding:5px 8px'>${f.name}</td>
        <td style='padding:5px 8px;text-align:right;font-weight:700;color:var(--green-d)'>${f.factor}</td>
        <td style='padding:5px 8px'>${f.unit}</td>
        <td style='padding:5px 8px;color:var(--muted);font-size:12px'>${f.source}（${f.year}）</td>
      </tr>`;
    });
  });
  h+="</tbody></table>";
  box.innerHTML=h;
}

const STORE_KEY = "carbon_platform_v2";

const State = {
  currentModule: "cover",
  viewed: {},        // 已学习内容 id 集合（用于进度）
  wrong: [],         // 错题 id 集合
  scores: {}         // 测验成绩 {quizId: correct}
};

function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s){ Object.assign(State, s); } }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({currentModule:State.currentModule,viewed:State.viewed,wrong:State.wrong,scores:State.scores})); }catch(e){}
}
function markViewed(id){ State.viewed[id]=1; saveState(); updateProgress(); }

function totalStudyItems(){
  let n=0;
  DATA.modules.forEach(m=>{
    n += m.knowledge.length;
    n += (m.terms?m.terms.length:0);
    n += (m.cases?m.cases.length:0);
    if(m.standards) n++;
    if(m.methods)   n++;
    if(m.flow)      n++;
    if(m.priceData) n++;
    if(m.esgList)   n++;
    if(m.esgCmp)    n++;
    if(m.esgCase)   n++;
    if(m.tools&&m.tools.length) n+=1;
    n += m.quiz.length;
  });
  n += allAssessQuestions().length;
  return n;
}
function doneStudyItems(){
  let n=0;
  const have = id => State.viewed[id];
  DATA.modules.forEach(m=>{
    m.knowledge.forEach((k,i)=>{ if(have(m.id+"_k"+i)) n++; });
    if(m.terms) m.terms.forEach((t,i)=>{ if(have(m.id+"_tm"+i)) n++; });
    (m.cases||[]).forEach((c,i)=>{ if(have(m.id+"_c"+i)) n++; });
    if(m.priceData && have(m.id+"_pd")) n++;
    if(m.esgList && have(m.id+"_esgl")) n++;
    if(m.esgCmp  && have(m.id+"_esgc")) n++;
    if(m.esgCase && have(m.id+"_esgcase")) n++;
    if(m.standards && have(m.id+"_std")) n++;
    if(m.methods   && have(m.id+"_mth")) n++;
    if(m.flow      && have(m.id+"_flw")) n++;
    if(m.tools&&m.tools.length && have(m.id+"_t")) n++;
    m.quiz.forEach(q=>{ if(State.scores[q.id]!==undefined) n++; });
  });
  allAssessQuestions().forEach(q=>{ if(State.scores[q.id]!==undefined) n++; });
  return n;
}
function updateProgress(){
  const pct = Math.round(doneStudyItems()/totalStudyItems()*100);
  const bar = document.getElementById("progressBar");
  if(bar) bar.style.width = pct + "%";
}

function esgHexA(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function esgRadarDraw(){
  const m = DATA.modules[curMod]; const C = m.esgCmp;
  const cv = document.getElementById("esgRadar"); if(!cv) return;
  const ctx = cv.getContext("2d"); const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2 + 4, R = Math.min(W,H)/2 - 54, N = C.dims.length;
  ctx.strokeStyle = "#dbe7e3"; ctx.lineWidth = 1;
  for(let r=1;r<=5;r++){
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const a = -Math.PI/2 + i*2*Math.PI/N;
      const x = cx + Math.cos(a)*R*r/5, y = cy + Math.sin(a)*R*r/5;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.strokeStyle = "#cfe0db";
  for(let i=0;i<N;i++){
    const a = -Math.PI/2 + i*2*Math.PI/N;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke();
  }
  ctx.font = "12.5px system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif";
  ctx.fillStyle = "#1f2937";
  for(let i=0;i<N;i++){
    const a = -Math.PI/2 + i*2*Math.PI/N;
    const x = cx + Math.cos(a)*(R+24), y = cy + Math.sin(a)*(R+20);
    ctx.textAlign = Math.abs(Math.cos(a))<0.25 ? "center" : (Math.cos(a)>0 ? "left" : "right");
    ctx.textBaseline = "middle";
    ctx.fillText(C.dims[i], x, y);
  }
  C.rows.forEach(r=>{
    if(!esgRadarSel[r.key]) return;
    const s = C.scores[r.key]; if(!s) return;
    const col = ESG_COLORS[r.key] || "#0E9F6E";
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const a = -Math.PI/2 + i*2*Math.PI/N, v = s[i]/100;
      const x = cx + Math.cos(a)*R*v, y = cy + Math.sin(a)*R*v;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle = esgHexA(col,.13); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = col;
    for(let i=0;i<N;i++){
      const a = -Math.PI/2 + i*2*Math.PI/N, v = s[i]/100;
      const x = cx + Math.cos(a)*R*v, y = cy + Math.sin(a)*R*v;
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    }
  });
}

/* 卡片摘要换行：取破折号/竖线前的主句 → 按顿号分条 → 超长条再按逗号控行 */
function sumHTML(d){
  var t=String(d||"").split("——")[0].split("｜")[0].trim();
  if(!t) return "";
  var out=[];
  t.split("、").forEach(function(p){
    p=p.trim(); if(!p) return;
    if(p.length>28){
      var arr=p.split("，");
      arr.forEach(function(q,i){ q=q.trim(); if(q) out.push(q+(i<arr.length-1?"，":"")); });
    } else out.push(p);
  });
  return out.length?out.join("<br>"):t;
}

/* 内嵌表格增强：可横向滚动时在其上方提示「左右滑动」，并同步状态 */
function enhanceTables(){
  try{
    var boxes=document.querySelectorAll(".tbl-wrap,.esg-mtx,#factorTable");
    for(var i=0;i<boxes.length;i++){
      var w=boxes[i];
      if(w.dataset.tblInit!=="1"){
        w.dataset.tblInit="1";
        var hint=document.createElement("div");
        hint.className="tbl-hint";
        hint.textContent="← 左右滑动查看完整内容 →";
        if(w.parentNode) w.parentNode.insertBefore(hint,w);
        (function(box){
          box.addEventListener("scroll",function(){
            var h=box.previousElementSibling;
            if(h&&h.className==="tbl-hint") h.classList.toggle("dim", box.scrollLeft>24);
          },{passive:true});
        })(w);
      }
      syncTblHint(w);
    }
    window.addEventListener("resize",function(){
      var bs=document.querySelectorAll(".tbl-wrap,.esg-mtx,#factorTable");
      for(var j=0;j<bs.length;j++) syncTblHint(bs[j]);
    });
  }catch(e){}
}
function syncTblHint(w){
  var h=w.previousElementSibling;
  if(!h||h.className!=="tbl-hint") return;
  h.style.display = (w.scrollWidth>w.clientWidth+4) ? "block" : "none";
}

/* ---------- 导出：XLSX（零依赖手写 ZIP + OOXML） ---------- */
function crc32(buf){
  let table=crc32._t;
  if(!table){
    table=crc32._t=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); table[n]=c>>>0; }
  }
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) crc=table[(crc^buf[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder();
  const parts=[],central=[]; let offset=0;
  const now=new Date();
  const dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  const dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dt,true); lv.setUint16(12,dd,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nb.length,true); lv.setUint16(28,0,true); lh.set(nb,30);
    parts.push(lh,data);
    const ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint16(12,dt,true); cv.setUint16(14,dd,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(42,offset,true); ch.set(nb,46);
    central.push(ch);
    offset+=lh.length+data.length;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  const all=parts.concat(central,[eo]);
  const total=all.reduce((a,b)=>a+b.length,0);
  const out=new Uint8Array(total); let p=0;
  all.forEach(b=>{ out.set(b,p); p+=b.length; });
  return out;
}
function xesc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function colName(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXML(rows){
  let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  rows.forEach((r,ri)=>{
    x+=`<row r="${ri+1}">`;
    r.forEach((c,ci)=>{
      const ref=colName(ci)+(ri+1);
      const raw=(c===null||c===undefined)?"":String(c);
      const isNum = raw!=="" && raw!=="待补充" && /^-?\d+(\.\d+)?$/.test(raw);
      if(isNum) x+=`<c r="${ref}"><v>${raw}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(raw)}</t></is></c>`;
    });
    x+=`</row>`;
  });
  return x+`</sheetData></worksheet>`;
}
function buildXLSX(sheets){ // sheets:[{name, rows}]
  const enc=new TextEncoder();
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
    `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
    `<Default Extension="xml" ContentType="application/xml"/>`+
    `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
    sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+
    `</Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>`+
    sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+`</sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
    sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+
    `</Relationships>`;
  const files=[
    {name:"[Content_Types].xml", data:enc.encode(ct)},
    {name:"_rels/.rels", data:enc.encode(rels)},
    {name:"xl/workbook.xml", data:enc.encode(wb)},
    {name:"xl/_rels/workbook.xml.rels", data:enc.encode(wbRels)}
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:enc.encode(sheetXML(s.rows))}));
  return zipStore(files);
}
function exportPriceXLSX(key){
  const D=CARBON_PRICE_DATA, ts=priceTables().filter(t=>key==="__ALL__"||t.key===key);
  const sheets=[];
  // 说明页
  const info=[["碳价市场数据表"],["数据截止时间",D.meta.cutoff],["本页更新",D.meta.updated],["价格单位",D.meta.unit],
    ["统计起始年份",D.meta.startYear],["全国CEA 时间区间",D.meta.rangeCEA],["CCER 时间区间",D.meta.rangeCCER],["试点 时间区间",D.meta.rangePilot],[],
    ["统计口径"]];
  D.meta.caliber.forEach((c,i)=>info.push([(i+1)+". "+c]));
  info.push([],["数据来源（编号 / 名称 / 覆盖范围 / 链接）"]);
  D.sources.forEach(s=>info.push([s.id,s.name,s.scope,s.url]));
  info.push([],["数据缺失与替代方案"]);
  D.gaps.forEach(g=>info.push([g.item,g.reason,g.alt]));
  sheets.push({name:"说明与数据源", rows:info});
  ts.forEach(t=>{
    const rows=[[t.title],[t.note],[],t.cols.slice()];
    t.rows.forEach(r=>rows.push(r.map(c=>String(c).replace(/<[^>]+>/g,""))));
    sheets.push({name:t.title.replace(/[^一-龥A-Za-z0-9·\-\s]/g,"").slice(0,28), rows});
  });
  try{
    const u8=buildXLSX(sheets);
    dlFile(new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),
      "碳价数据_"+(key==="__ALL__"?"全部":key)+"_"+D.meta.cutoff+".xlsx");
    toast("Excel 已导出");
  }catch(e){ toast("Excel 导出失败："+e.message+"，请改用 CSV 导出"); }
}
function dlFile(blob,name){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
    a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); }catch(x){} URL.revokeObjectURL(url); },3000);
  }catch(e){ toast("下载失败："+e.message); }
}

    <p class="hint">点击带「N 项 ›」的节点可逐级下钻；点击标准名称（带「查看内容 ›」）时，以单一富文本框展示该标准的主要内容。点击右上角「⤢ 放大」可在全屏框内查看。<br></p>
    <div class="mind-box" id="mindBox"><div class="mind-toolbar">

let mindPath=[];   // 思维导图聚焦路径（节点索引数组）
let mindDetail=-1; // 末级「标准」节点详情：当前聚焦节点下的子索引，-1 表示未打开
function curMindData(){
  const m=DATA.modules[curMod];
  return (m.standards && m.standards.mind) || (m.esgCmp && m.esgCmp.mind) || {t:"",c:[]};
}
function mindNode(){
  let n=curMindData();
  mindPath.forEach(i=>{ n = (n.c&&n.c[i])?n.c[i]:n; });
  return n;
}
function mindRender(){
  const n=mindNode();
  const cv=document.getElementById("mindCanvas"); if(!cv) return;
  const crumb=document.getElementById("mindCrumb");
  if(crumb){
    let p=curMindData(), names=[];
    names.push(p.t);
    mindPath.forEach(i=>{ p=(p.c&&p.c[i])?p.c[i]:p; names.push(p.t); });
    crumb.textContent=names.join(" › ") + (mindDetail>=0 ? " › 标准详情" : "");
  }
  const up=document.getElementById("mindUpBtn"); if(up) up.style.visibility = (mindPath.length||mindDetail>=0)? "visible":"hidden";
  let h=`<div class="mind-root"><div class="mind-n root" onclick="mindUp()">${n.t}${n.d?`<span class="mind-sub">${n.d}</span>`:""}</div></div>`;
  if(mindDetail>=0 && n.c && n.c[mindDetail]){
    /* 末级「标准」节点：以单一富文本框展示该标准的主要内容，不再展开下级分支 */
    const d=n.c[mindDetail];
    h+=`<div class="mind-detail">
      <div class="mind-dt">${d.t}${d.d?`<span class="mind-ds">${d.d}</span>`:""}</div>
      <div class="mind-db">${d.body||"该标准暂无详细说明。"}</div>
      <div class="mind-dback"><button class="cv-btn" onclick="mindCloseDetail()">← 返回「${n.t}」</button></div>
    </div>`;
  }else if(n.c && n.c.length){
    h+=`<div class="mind-children">`;
    n.c.forEach((c,i)=>{
      const hasChild = c.c && c.c.length;
      const isDoc = !!c.body;
      h+=`<div class="mind-n ${(hasChild&&!isDoc)?'haschild':'doc'}" onclick="mindDrill(${i})">
        <span class="mind-t">${c.t}</span>${c.d?`<span class="mind-sub">${c.d}</span>`:""}
        ${isDoc?`<span class="mind-more">查看内容 ›</span>`:(hasChild?`<span class="mind-more">${c.c.length} 项 ›</span>`:"")}
      </div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="mind-leaf">该节点为末级，内容：${n.d||n.t}</div>`;
  }
  cv.innerHTML=h;
}
function mindDrill(i){
  const n=mindNode(); const c=n.c&&n.c[i]; if(!c) return;
  if(c.body){ mindDetail=i; }          // 标准节点 → 富文本框
  else { mindDetail=-1; mindPath.push(i); }  // 分组节点 → 继续下钻
  mindRender();
}
function mindCloseDetail(){ mindDetail=-1; mindRender(); }
function mindUp(){
  if(mindDetail>=0){ mindDetail=-1; }
  else if(mindPath.length){ mindPath.pop(); }
  mindRender();
}
function mindZoom(){
  const b=document.getElementById("mindBox"); if(!b) return;
  b.classList.toggle("full");
}

/* =========================================================================
   测验渲染与判分（通用）
   ========================================================================= */
function quizHTML(q){
  let opts="";
  if(q.type==="choice"){
    opts=q.options.map((o,i)=>`<div class="opt" data-i="${i}" onclick="pickOpt('${q.id}',this,${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join("");
  }else{
    // judge: options 为 ["正确","错误"]，answer 0/1
    opts=q.options.map((o,i)=>`<div class="opt" data-i="${i}" onclick="pickOpt('${q.id}',this,${i})">${o}</div>`).join("");
  }
  return `<div class="quiz" id="quiz_${q.id}">
    <div class="q"><span class="num">Q</span>${q.q}<span class="type">${q.type==="choice"?"选择题":"判断题"}</span></div>
    ${opts}
    <div class="feedback" id="fb_${q.id}"></div>
    <div class="explain" id="ex_${q.id}"><b>解析：</b>${q.explain}</div>
  </div>`;
}
function pickOpt(qid, el, i){
  const quizEl=document.getElementById("quiz_"+qid);
  if(quizEl.dataset.done==="1") return;
  quizEl.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  // 找到题目
  let q=findQuiz(qid); if(!q) return;
  const fb=document.getElementById("fb_"+qid);
  const ex=document.getElementById("ex_"+qid);
  const correct = (i===q.answer);
  quizEl.dataset.done="1";
  quizEl.querySelectorAll(".opt").forEach(o=>{
    if(+o.dataset.i===q.answer) o.classList.add("correct");
    else if(+o.dataset.i===i) o.classList.add("wrong");
  });
  fb.textContent = correct ? "✅ 回答正确！" : "❌ 回答错误";
  fb.style.color = correct ? "var(--green-d)" : "var(--red)";
  ex.classList.add("show");
  State.scores[qid]=correct?1:0;
  if(!correct){
    if(!State.wrong.includes(qid)) State.wrong.push(qid);
  }else{
    // 答对后从错题本移除，便于反复练习直至掌握
    const idx=State.wrong.indexOf(qid);
    if(idx>=0) State.wrong.splice(idx,1);
  }
  saveState(); updateProgress();
}
function findQuiz(qid){
  for(const m of DATA.modules){ const f=m.quiz.find(x=>x.id===qid); if(f) return f; }
  for(const st of DATA.assess.comprehensive){ const f=st.qs.find(x=>x.id===qid); if(f) return f; }
  return null;
}
function allAssessQuestions(){
  const out=[];
  DATA.modules.forEach(m=>m.quiz.forEach(q=>out.push(q)));
  DATA.assess.comprehensive.forEach(st=>st.qs.forEach(q=>out.push(q)));
  return out;
}

let curAcc=0;
function initAccounting(){
  const accs=DATA.scenarios.accounting;
  const atb=document.getElementById("accTabs");
  if(atb){
    const at=`<div class="subtabs">`+accs.map((a,i)=>`<button data-i="${i}" class="${i===0?'active':''}" onclick="switchAcc(${i})">${a.title}</button>`).join("")+`</div>`;
    atb.innerHTML=at;
  }
  switchAcc(0);
}
function switchAcc(i){
  curAcc=i;
  document.querySelectorAll("#accTabs button").forEach(b=>b.classList.toggle("active",+b.dataset.i===i));
  const a=DATA.scenarios.accounting[i];
  const intro=document.getElementById("accIntro"); if(intro) intro.textContent=a.intro;
  let ai="";
  a.inputs.forEach((it,idx)=>{
    ai+=`<div class="field"><label>${it.k}（${it.unit}）</label>
      <input type="number" id="acc_${idx}" value="${it.amt}" step="any"></div>`;
  });
  const box=document.getElementById("accInputs"); if(box) box.innerHTML=ai;
  const r=document.getElementById("accResult"); if(r){ r.innerHTML="填写各能源用量并点击「计算排放量」。"; r.style.borderColor=""; }
}
function initDecision(){
  const dbox=document.getElementById("decisionBox"); if(!dbox) return;
  const db=`<div class="subtabs">`+DATA.scenarios.decision.map((d,i)=>`<button data-i="${i}" class="${i===0?'active':''}" onclick="switchDecision(${i})">情景 ${i+1}</button>`).join("")+`</div><div id="decisionContent"></div>`;
  dbox.innerHTML=db;
  switchDecision(0);
}
function initLife(){
  const lbox=document.getElementById("lifeBox"); if(!lbox) return;
  let lb="";
  DATA.scenarios.lifestyle.forEach((l,i)=>{
    let opts=l.options.map((o,j)=>`<div class="decision-opt" onclick="pickLife(${i},${j})">${o.text}<span class="pill b">${o.co2}</span></div>`).join("");
    lb+=`<div style="margin-bottom:18px"><div style="font-weight:700;margin-bottom:8px">${i+1}. ${l.scene}</div>${opts}<div id="life_${i}" class="result-line" style="display:none"></div></div>`;
  });
  lbox.innerHTML=lb;
}
function calcAccounting(idx){
  idx = (idx==null)?curAcc:idx;
  const a=DATA.scenarios.accounting[idx];
  let total=0; const parts=[];
  a.inputs.forEach((it,i)=>{
    const amt=parseFloat(document.getElementById("acc_"+i).value)||0;
    let fv, f;
    if(it.k==="电力"){ fv=gridFactor(); f={unit:"kgCO₂/kWh",source:FACTORS["电力"]?FACTORS["电力"].source:""}; }
    else { f=FACTORS[it.k]; fv=f?f.v:0; }
    const e=amt*fv; total+=e; parts.push({k:it.k,e,unit:f?f.unit:""});
  });
  let txt=`该企业年度 CO₂ 总排放量约为 <b>${total.toFixed(1)} 吨</b>。分项（已按权威排放因子折算）：`;
  txt+=parts.map(p=>`${p.k} ${p.e.toFixed(1)} t`).join("，")+"。";
  const r=document.getElementById("accResult"); r.innerHTML=txt+`<div class="reflect">💡 学习思考：${a.reflect}</div>`;
  r.style.borderColor="var(--green-l)";
  markViewed("sc_accounting_"+idx);
}
function autoFillAccounting(idx){
  idx = (idx==null)?curAcc:idx;
  const a=DATA.scenarios.accounting[idx];
  a.inputs.forEach((it,i)=>{ const el=document.getElementById("acc_"+i); if(el) el.value=it.amt; });
  calcAccounting(idx);
  toast("已填入参考能耗数据");
}
function switchDecision(i){
  document.querySelectorAll("#decisionBox .subtabs button").forEach(b=>b.classList.toggle("active",+b.dataset.i===i));
  const d=DATA.scenarios.decision[i];
  let h=`<div style="font-weight:700;margin-bottom:10px">${d.scene}</div>`;
  h+=d.options.map((o,j)=>`<div class="decision-opt" onclick="pickDecision(${i},${j})">${o.text}</div>`).join("");
  h+=`<div id="dec_${i}" class="decision-result" style="display:none"></div>`;
  document.getElementById("decisionContent").innerHTML=h;
}
function pickDecision(i,j){
  const o=DATA.scenarios.decision[i].options[j];
  const el=document.getElementById("dec_"+i);
  el.className="decision-result "+o.level;
  el.style.display="block";
  el.innerHTML=`<b>结果（${o.level==="good"?"✅ 优选":o.level==="mid"?"⚠️ 过渡可行":"❌ 不推荐"}）：</b>${o.result}<br><span class="pill ${o.level==="good"?"g":o.level==="mid"?"b":"r"}">${o.emission}</span>`+(o.reflect?`<div class="reflect">💡 ${o.reflect}</div>`:"");
  markViewed("dec_"+i);
}
function pickLife(i,j){
  const o=DATA.scenarios.lifestyle[i].options[j];
  const el=document.getElementById("life_"+i);
  el.style.display="block";
  el.innerHTML=`你选择「${o.text}」，碳排放约 <b>${o.co2}</b>。${o.note}`+(o.reflect?`<div class="reflect">💡 ${o.reflect}</div>`:"");
  markViewed("life_"+i);
}

function initPeak(){
  const pc=[
    {id:"p_base",label:"2020 基准排放（亿吨）",min:80,max:130,val:100},
    {id:"p_growth",label:"达峰前年增速(%)",min:0,max:8,val:3,step:0.5},
    {id:"p_peakyear",label:"达峰年份",min:2025,max:2035,val:2030},
    {id:"p_decline",label:"达峰后年降幅(%)",min:1,max:10,val:4,step:0.5}
  ];
  let ph="";
  pc.forEach(p=>{
    ph+=`<div class="field"><label>${p.label}：<b id="${p.id}_v">${p.val}</b></label>
      <input type="range" id="${p.id}" min="${p.min}" max="${p.max}" step="${p.step||1}" value="${p.val}" oninput="onPeakChange('${p.id}')"></div>`;
  });

function calcEmission(){
  let total=0; const labels=[], vals=[];
  CALC_FUELS.forEach((k,idx)=>{
    const amt=parseFloat(document.getElementById("cf_"+idx).value)||0;
    const fv = (k==="电力") ? gridFactor() : (FACTORS[k]?FACTORS[k].v:0);
    const e=amt*fv; total+=e; labels.push(k); vals.push(e);
  });
  drawBar("calcChart", labels, vals, "#0E9F6E");
  const gf=gridFactor();
  document.getElementById("calcTotal").innerHTML=`总排放约 <b>${total.toFixed(2)} 吨 CO₂</b>；电力采用「${curGrid}」因子 ${gf.toFixed(4)} kgCO₂/kWh。`;
  const src=document.getElementById("factorSrc");
  if(src) src.innerHTML=`数据来源：${FACTORS["电力"]?FACTORS["电力"].source:""}、IPCC 2006 等权威缺省因子。点击「联网获取最新因子」可同步更新。`;
}
function onPeakChange(id){
  const v=document.getElementById(id).value;
  document.getElementById(id+"_v").textContent=v;
  drawPeak();
}
function drawPeak(){
  const base=+document.getElementById("p_base").value;
  const g=+document.getElementById("p_growth").value/100;
  const py=+document.getElementById("p_peakyear").value;
  const d=+document.getElementById("p_decline").value/100;
  const years=[]; const vals=[];
  for(let y=2020;y<=2060;y++){
    let e;
    if(y<=py){ e=base*Math.pow(1+g,(y-2020)); }
    else { const peak=base*Math.pow(1+g,(py-2020)); e=peak*Math.pow(1-d,(y-py)); }
    years.push(y); vals.push(e);
  }
  drawLine("peakChart", years, vals, "#0369A1", base, py);
  const end=vals[vals.length-1];
  const ok = end<=base*0.05;
  document.getElementById("peakResult").innerHTML=
    `预计 <b>${py} 年</b>达峰，峰值约 <b>${(base*Math.pow(1+g,(py-2020))).toFixed(1)} 亿吨</b>；2060 年降至约 <b>${end.toFixed(1)} 亿吨</b>。`+
    (ok?` <span class="pill g">✓ 接近中和</span>`:` <span class="pill r">未充分中和，需加大降幅</span>`);
}
function drawBenchmark(){
  const data=DATA.visual.industryBenchmark;
  drawBarH("benchChart", data.map(d=>d.name), data.map(d=>d.value), "#0EA5E9", data.map(d=>d.unit));
}

/* ----- Canvas 绘图工具 ----- */
function setupCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.width, h=cv.height;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}
function drawBar(id, labels, vals, color){
  const cv=document.getElementById(id); if(!cv) return;
  const {ctx,w,h}=setupCanvas(cv);
  const padL=44,padB=46,padT=16,padR=12;
  const cw=w-padL-padR, ch=h-padT-padB;
  const max=Math.max(...vals,0.0001);
  ctx.strokeStyle="#e3edea"; ctx.fillStyle="#6b7280"; ctx.font="11px sans-serif";
  for(let i=0;i<=4;i++){ const y=padT+ch*i/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText((max*(4-i)/4).toFixed(max<1?2:0), 4, y+4); }
  const bw=cw/labels.length*0.6; const gap=cw/labels.length;
  vals.forEach((v,i)=>{
    const bh=ch*v/max; const x=padL+gap*i+(gap-bw)/2; const y=padT+ch-bh;
    ctx.fillStyle=color; roundRect(ctx,x,y,bw,bh,4); ctx.fill();
    ctx.fillStyle="#374151"; ctx.textAlign="center"; ctx.fillText(labels[i], padL+gap*i+gap/2, h-padB+14);
    ctx.fillText(v.toFixed(v<1?2:1), padL+gap*i+gap/2, y-4); ctx.textAlign="left";
  });
}
function drawBarH(id, labels, vals, color, units){
  const cv=document.getElementById(id); if(!cv) return;
  const {ctx,w,h}=setupCanvas(cv);
  const padL=110,padR=60,padT=14,padB=20;
  const cw=w-padL-padR, ch=h-padT-padB;
  const max=Math.max(...vals,0.0001); const rowH=ch/labels.length;
  ctx.font="12px sans-serif";
  vals.forEach((v,i)=>{
    const bw=cw*v/max; const y=padT+rowH*i+rowH*0.18; const bh=rowH*0.64;
    ctx.fillStyle=color; roundRect(ctx,padL,y,bw,bh,5); ctx.fill();
    ctx.fillStyle="#1f2937"; ctx.textAlign="right"; ctx.fillText(labels[i], padL-8, y+bh/2+4);
    ctx.textAlign="left"; ctx.fillStyle="#374151"; ctx.fillText(v.toFixed(v<1?2:0)+" "+ (units?units[i]||"":""), padL+bw+6, y+bh/2+4);
  });
}
function drawLine(id, years, vals, color, base, py){
  const cv=document.getElementById(id); if(!cv) return;
  const {ctx,w,h}=setupCanvas(cv);
  const padL=42,padB=28,padT=14,padR=12;
  const cw=w-padL-padR, ch=h-padT-padB;
  const max=Math.max(...vals)*1.05, min=0;
  const X=i=>padL+cw*i/(years.length-1);
  const Y=v=>padT+ch*(1-(v-min)/(max-min));
  ctx.strokeStyle="#e3edea"; ctx.fillStyle="#6b7280"; ctx.font="10px sans-serif";
  for(let i=0;i<=4;i++){ const y=padT+ch*i/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText((max*(4-i)/4).toFixed(0), 6, y+4); }
  // x ticks
  [2020,2030,2040,2050,2060].forEach(yr=>{ const i=yr-2020; if(i>=0&&i<years.length){ ctx.fillText(yr, X(i)-10, h-10); } });
  // peak marker
  const pi=py-2020;
  ctx.strokeStyle="#d97706"; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(X(pi),padT); ctx.lineTo(X(pi),padT+ch); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle="#d97706"; ctx.fillText("达峰 "+py, X(pi)-18, padT+10);
  // line
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
  vals.forEach((v,i)=>{ const x=X(i),y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
  ctx.fillStyle=color; vals.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(X(i),Y(v),2.5,0,7); ctx.fill(); });
}
function roundRect(ctx,x,y,w,h,r){ if(h<0){y+=h;h=-h;} r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* =========================================================================
   智能问答（关键词匹配，装配于模块 01 的「工具与情景」阶段）
   ========================================================================= */
function askQA(){
  const q=document.getElementById("qaInput").value.trim();
  if(!q){ toast("请输入问题"); return; }
  answerQA(q);
}
function quickQA(q){ document.getElementById("qaInput").value=q; answerQA(q); }
function answerQA(q){
  const qa=DATA.policy.qa;
  const ql=q.toLowerCase();
  let best=null,bestScore=0;
  qa.forEach(item=>{
    const kw=item.q.toLowerCase().split(/[\s,，。?？、/]+/).filter(Boolean);
    let s=0; kw.forEach(w=>{ if(ql.includes(w)) s+=2; });
    if(ql.includes(item.q.toLowerCase())) s+=3;
    if(s>bestScore){ bestScore=s; best=item; }
  });
  const box=document.getElementById("qaAnswer");
  if(best&&bestScore>0){ box.innerHTML=`<b style="color:var(--green-d)">${best.q}：</b><br>${best.a}`; }
  else{ box.innerHTML=`未匹配到精确答案。您可以试试问：「什么是碳达峰」「碳中和是什么」「碳交易怎么运作」「ccus 是什么」「3060 目标」「碳汇」「esg」「绿电」等。`; }
}

   考核工具（装配于顶部导航「考核认证」独立页）：综合测试 + 错题本
   ========================================================================= */
let curStage=0;
function initExam(){
  const allQ=allAssessQuestions();
  const done=allQ.filter(q=>State.scores[q.id]!==undefined).length;
  const correct=allQ.filter(q=>State.scores[q.id]===1).length;
  const stats=document.getElementById("examStats");
  if(stats){
    stats.innerHTML=`<div class="grid g4" style="margin-bottom:16px">
    <div class="card stat"><div class="n">${doneStudyItems()}/${totalStudyItems()}</div><div class="l">总学习进度</div></div>
    <div class="card stat"><div class="n">${done}/${allQ.length}</div><div class="l">已完成测验</div></div>
    <div class="card stat"><div class="n">${correct}</div><div class="l">答对题数</div></div>
    <div class="card stat"><div class="n">${State.wrong.length}</div><div class="l">错题数</div></div>
  </div>`;
  }
  switchCompStage(0);
}
function switchAssess(s){
  document.querySelectorAll("#assessTabs button").forEach(b=>b.classList.toggle("active",+b.dataset.s===s));
  if(s===1){ switchCompStage(curStage); }
  else { renderWrongBook(); }
}
function switchCompStage(i){
  curStage=i;
  const stages=DATA.assess.comprehensive, st=stages[i];
  const d=st.qs.filter(q=>State.scores[q.id]!==undefined).length;
  const c=st.qs.filter(q=>State.scores[q.id]===1).length;
  let h=`<div class="subtabs" id="stageTabs" style="margin-bottom:8px">`+
    stages.map((x,k)=>`<button data-k="${k}" class="${k===i?'active':''}" onclick="switchCompStage(${k})">${x.stage}</button>`).join("")+`</div>`;
  h+=`<p class="hint" style="margin-bottom:12px">${st.desc}<br>本阶段共 <b>${st.qs.length}</b> 题，已完成 <b>${d}</b> 题，答对 <b>${c}</b> 题。</p>`;
  h+=st.qs.map(q=>quizHTML(q)).join("");
  const box=document.getElementById("assessContent"); if(box) box.innerHTML=h;
  st.qs.forEach(q=>{ if(State.scores[q.id]!==undefined) restoreQuizState(q); });
}
// 重新渲染时恢复题目已作答的视觉状态
function restoreQuizState(q){
  const quizEl=document.getElementById("quiz_"+q.id); if(!quizEl) return;
  const ok=State.scores[q.id]===1;
  quizEl.dataset.done="1";
  quizEl.querySelectorAll(".opt").forEach(o=>{
    if(+o.dataset.i===q.answer) o.classList.add("correct");
  });
  const fb=document.getElementById("fb_"+q.id);
  if(fb){ fb.textContent = ok ? "✅ 回答正确！" : "❌ 回答错误"; fb.style.color = ok ? "var(--green-d)" : "var(--red)"; }
  const ex=document.getElementById("ex_"+q.id); if(ex) ex.classList.add("show");
}
function renderWrongBook(){
  if(State.wrong.length===0){
    document.getElementById("assessContent").innerHTML=`<div class="result-line">🎉 暂无错题，继续保持！完成测验后答错的题目会自动出现在这里，可反复练习。</div>`;
    return;
  }
  let h=`<p class="hint" style="margin-bottom:10px">以下为答错题目，点击选项可重新作答（答对即自动移出错题本）。</p>`;
  State.wrong.forEach(qid=>{
    const q=findQuiz(qid); if(!q) return;
    const tag=quizBelongs(qid);
    h+=`<div style="font-size:12px;color:var(--muted);margin:10px 0 2px">📌 来源：${tag}</div>`+quizHTML(q);
  });
  h+=`<div style="margin-top:10px"><button class="btn ghost" onclick="clearWrong()">清空错题本</button></div>`;
  document.getElementById("assessContent").innerHTML=h;
}
function quizBelongs(qid){
  for(const m of DATA.modules){ if(m.quiz.some(x=>x.id===qid)) return m.icon+" "+m.no+" "+m.name; }
  for(const st of DATA.assess.comprehensive){ if(st.qs.some(x=>x.id===qid)) return "🎓 "+st.stage; }
  return "综合";
}
function clearWrong(){ State.wrong=[]; saveState(); renderWrongBook(); toast("错题本已清空"); }

/* =========================================================================

/* ---- 文件名 / 转义 ---- */
function exportFileName(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return "carbon_platform_data_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
}
function escHTML(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---- 方式一：File System Access API，弹出系统「另存为」对话框自选路径 ---- */
function exportData(){
  const text=JSON.stringify(DATA,null,2);
  const name=exportFileName();
  if(typeof window.showSaveFilePicker==="function" && window.isSecureContext){
    try{
      window.showSaveFilePicker({
        suggestedName:name,
        types:[{description:"JSON 数据文件",accept:{"application/json":[".json"],"text/plain":[".json"]}}]
      }).then(async fh=>{
        try{
          const w=await fh.createWritable();
          await w.write(text);
          await w.close();
          toast("✅ 已保存到你选择的位置："+fh.name);
        }catch(err){
          toast("写入失败："+err.message+"　已改用浏览器下载");
          fallbackDownload(text,name);
        }
      }).catch(err=>{
        if(err && err.name==="AbortError"){ toast("已取消保存"); return; }
        // 某些环境（iframe / 沙箱）不允许该 API，静默回退
        fallbackDownload(text,name);
      });
      return;
    }catch(e){ /* 继续回退 */ }
  }
  fallbackDownload(text,name);
}

/* ---- 方式二：a[download] 触发浏览器下载（修复：必须挂到 DOM 且延迟回收 URL） ---- */
function fallbackDownload(text,name){
  try{
    const blob=new Blob([text],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name||exportFileName(); a.rel="noopener";
    a.style.display="none";
    document.body.appendChild(a);          // 关键：游离节点在部分浏览器不触发下载
    a.click();
    setTimeout(function(){
      try{ document.body.removeChild(a); }catch(e){}
      URL.revokeObjectURL(url);            // 关键：立即回收会导致下载被中断
    },3000);
    toast("已触发下载："+(name||exportFileName())+"｜若无反应请检查浏览器下载权限");
  }catch(e){
    toast("下载失败："+e.message+"　已打开手动保存面板");
    openExportPanel();
  }
}

/* ---- 方式三：手动保存面板（复制 / 新窗口另存 / 再试下载） ---- */
let _ioEsc=null;
function closeIoPanel(){
  const m=document.getElementById("ioMask");
  if(m && m.parentNode) m.parentNode.removeChild(m);
  if(_ioEsc){ document.removeEventListener("keydown",_ioEsc); _ioEsc=null; }
}
function ioPanel(title,bodyHTML){
  closeIoPanel();
  const d=document.createElement("div");
  d.className="io-mask"; d.id="ioMask";
  d.innerHTML='<div class="io-box"><h3>'+escHTML(title)+'</h3>'+bodyHTML+
    '<div class="io-row"><button class="io-btn ghost" onclick="closeIoPanel()">关闭</button></div></div>';
  d.addEventListener("mousedown",function(e){ if(e.target===d) closeIoPanel(); });
  _ioEsc=function(e){ if(e.key==="Escape") closeIoPanel(); };
  document.addEventListener("keydown",_ioEsc);
  document.body.appendChild(d);
  return d;
}
function openExportPanel(){
  const name=exportFileName();
  const text=JSON.stringify(DATA,null,2);
  ioPanel("导出数据 · 手动保存（"+name+"）",
    '<p class="io-tip">若浏览器不弹出保存框，请用下列任一方式：<br>'+
    '<b>①</b> 点「复制到剪贴板」→ 粘贴到记事本 → 另存为 <b>'+name+'</b>；<br>'+
    '<b>②</b> 点「在新窗口打开」→ Ctrl+S 另存为 .json；<br>'+
    '<b>③</b> 点「再次尝试下载」。</p>'+
    '<textarea id="ioText" readonly spellcheck="false">'+escHTML(text)+'</textarea>'+
    '<div class="io-row">'+
    '<button class="io-btn" onclick="copyIoText()">复制到剪贴板</button>'+
    '<button class="io-btn blue" onclick="openBlobWindow()">在新窗口打开</button>'+
    '<button class="io-btn ghost" onclick="retryDownload()">再次尝试下载</button>'+
    '</div>');
}
function retryDownload(){
  const el=document.getElementById("ioText");
  fallbackDownload((el&&el.value)||JSON.stringify(DATA,null,2), exportFileName());
}
function copyIoText(){
  const t=document.getElementById("ioText"); if(!t) return;
  t.removeAttribute("readonly"); t.focus(); t.select();
  try{ t.setSelectionRange(0,t.value.length); }catch(e){}
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  t.setAttribute("readonly","readonly");
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(function(){ toast("已复制到剪贴板"); })
      .catch(function(){ toast("复制失败，请手动 Ctrl+A / Ctrl+C"); });
    return;
  }
  toast(ok?"已复制到剪贴板":"复制失败，请手动 Ctrl+A / Ctrl+C");
}
function openBlobWindow(){
  const el=document.getElementById("ioText");
  const text=(el&&el.value)||JSON.stringify(DATA,null,2);
  try{
    const blob=new Blob([text],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(!w){
      toast("新窗口被拦截：请允许本页弹出窗口后重试，或改用「复制到剪贴板」");
      return;
    }
    setTimeout(function(){ URL.revokeObjectURL(url); },60000);
    toast("已在新窗口打开，请用 Ctrl+S 另存为 .json");
  }catch(e){ toast("打开失败："+e.message); }
}

/* ---- 导入：方式一 文件选择器 ---- */
function pickImportFile(){
  let el=document.getElementById("fileIn");
  if(!el){                                    // 元素被移除时自动重建
    el=document.createElement("input");
    el.type="file"; el.id="fileIn";
    el.accept="application/json,.json,text/plain";
    el.style.display="none";
    el.onchange=function(){ importData(this); };
    document.body.appendChild(el);
  }
  try{ el.value=""; el.click(); }
  catch(e){
    toast("无法打开文件选择器："+e.message+"　已打开文本导入窗口");
    openImportPanel();
  }
}
function importData(input){
  const file=input && input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onerror=function(){ toast("文件读取失败，将打开文本导入窗口，可粘贴 JSON 导入"); openImportPanel(); };
  reader.onload=function(e){
    try{ handleImportText(String(e.target.result||"")); }
    catch(err){ toast("导入失败："+err.message); }
    try{ input.value=""; }catch(x){}
  };
  reader.readAsText(file,"utf-8");
}

/* ---- 导入：方式二 粘贴文本 ---- */
function openImportPanel(){
  ioPanel("导入数据 · 粘贴 JSON",
    '<p class="io-tip">把之前导出的 JSON 全文粘贴到下面，点「开始导入」。<br>'+
    '若系统文件选择器打不开，也可以先点「选择文件…」再试一次。</p>'+
    '<textarea id="ioText" spellcheck="false" placeholder="{&quot;modules&quot;:[{&quot;id&quot;:&quot;m01&quot;,&quot;name&quot;:&quot;…&quot;,&quot;knowledge&quot;:[…]}]}"></textarea>'+
    '<div class="io-row">'+
    '<button class="io-btn" onclick="importFromText()">开始导入</button>'+
    '<button class="io-btn ghost" onclick="pickImportFile()">选择文件…</button>'+
    '</div>');
}
function importFromText(){
  const t=document.getElementById("ioText");
  if(!t || !t.value.trim()){ toast("请先粘贴 JSON 内容"); return; }
  try{ handleImportText(t.value); }
  catch(err){ toast("导入失败："+err.message); }
}
function handleImportText(txt){
  let obj;
  try{ obj=JSON.parse(txt); }
  catch(e){ throw new Error("不是合法的 JSON（"+e.message+"）"); }
  if(!obj || typeof obj!=="object" || Array.isArray(obj)) throw new Error("根节点必须是一个对象");
  if(!Array.isArray(obj.modules) || !obj.modules.length) throw new Error("缺少 modules 数组或为空");
  let ok=0;
  obj.modules.forEach(function(m){
    if(m && m.id && m.name && Array.isArray(m.knowledge)) ok++;
  });
  if(!ok) throw new Error("modules 内没有合法的模块（需含 id / name / knowledge）");
  applyImported(obj, ok);
}
function applyImported(obj, okCount){
  try{
    DATA.modules=obj.modules;
    if(obj.assess) DATA.assess=obj.assess;
    const valid={};
    DATA.modules.forEach(function(m){ valid[m.id]=1; });
    if(!valid[State.currentModule]) State.currentModule="cover";
    curMod=0;
    try{ mindPath=[]; mindDetail=-1; }catch(e){}
    saveState();
    closeIoPanel();
    toast("✅ 导入成功："+DATA.modules.length+" 个模块（校验通过 "+okCount+" 个），正在重新渲染…");
    setTimeout(function(){ go(State.currentModule); },350);
  }catch(e){ toast("应用失败："+e.message); }
}

/* =========================================================================
   快捷键说明 & 初始化
   ========================================================================= */
function showHelp(){
  toast("← → 翻页 ｜ 点击卡片展开 ｜ 封面可导入/导出数据");
}
const RENDER={};
RENDER["s1"]=()=>renderSectionLanding(SECTIONS[0]);
RENDER["s2"]=()=>renderSectionLanding(SECTIONS[1]);
RENDER["s8"]=()=>renderSectionLanding(SECTIONS[7]);
DATA.modules.forEach(m=>{ RENDER[m.id]=()=>renderModule(m.id); });
/* 「考核认证」独立页：阶段性综合测试 + 错题本 */
function renderExamPage(){
  const allQ=allAssessQuestions();
  const done=allQ.filter(q=>State.scores[q.id]!==undefined).length;
  const correct=allQ.filter(q=>State.scores[q.id]===1).length;
  let h=`<div class="module-title"><div class="ic">🏅</div><h2>考核认证</h2></div>
  <div class="module-desc">阶段性综合测试 + 错题本。各模块的分科测验已内置在对应模块的「随堂小测」阶段；此处为跨模块综合检验与错题集中练习。</div>
  <div class="grid g4" id="examStats" style="margin-bottom:16px">
    <div class="card stat"><div class="n">${doneStudyItems()}/${totalStudyItems()}</div><div class="l">总学习进度</div></div>
    <div class="card stat"><div class="n">${done}/${allQ.length}</div><div class="l">已完成综合测验</div></div>
    <div class="card stat"><div class="n">${correct}</div><div class="l">答对题数</div></div>
    <div class="card stat"><div class="n">${State.wrong.length}</div><div class="l">错题数</div></div>
  </div>
  <div class="card" style="padding:18px">
    <div class="subtabs" id="assessTabs">
      <button class="active" data-s="1" onclick="switchAssess(1)">🎓 阶段性综合测试</button>
      <button data-s="2" onclick="switchAssess(2)">📕 错题本</button>
    </div><div id="assessContent"></div></div>`;
  return h;
}
RENDER["exam"]=renderExamPage;
function afterRender(){
  if(State.currentModule==="exam"){ switchCompStage(0); return; }
  const m=DATA.modules.find(x=>x.id===State.currentModule);
  if(m){ switchModStage(0); }
}
// 重写 go 以加入 afterRender
function go(m){
  if(!MODULE_ORDER.includes(m)) m="cover";
  State.currentModule=m; saveState();
  const _sec=secOf(m);
  document.querySelectorAll(".nav .tab").forEach(b=>b.classList.toggle("active", b.dataset.m===_sec));
  const main=document.getElementById("main");
  main.classList.remove("fade-in"); void main.offsetWidth;
  main.innerHTML = (m==="cover") ? coverHTML() : (RENDER[m]||coverHTML)();
  main.classList.add("fade-in");
  window.scrollTo({top:0,behavior:"smooth"});
  updateProgress();
  afterRender();
  enhanceTables();
}

loadState();
go(State.currentModule&&MODULE_ORDER.includes(State.currentModule)?State.currentModule:"cover");
</script>
