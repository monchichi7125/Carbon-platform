<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="UlFw0F6MjDEhXf0eagwspF">
<head data-page-node-id="pVwJSNG1QXXLKFA4iNFpBU">
<meta charset="UTF-8" data-page-node-id="PQiz3XtwFqn4JgwRnojiyy">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="4W6rllctrQgyBv2aJkWS8i">
<title>双碳学习平台 · 碳达峰碳中和知识学习系统</title>
<style>
  :root{
    --green:#0E9F6E; --green-d:#0a7d56; --green-l:#34d399;
    --blue:#0369A1; --blue-l:#0EA5E9;
    --bg:#f3f8f6; --card:#ffffff; --line:#e3edea;
    --text:#1f2937; --muted:#6b7280; --warn:#d97706; --red:#dc2626;
    --shadow:0 6px 22px rgba(13,80,70,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}

  /* ===== Cover ===== */
  .cover{background:linear-gradient(135deg,#0E9F6E 0%,#0b8f86 48%,#0369A1 100%);color:#fff;padding:64px 18px 36px;text-align:center;position:relative;overflow:hidden}
  .cover::before,.cover::after{content:"";position:absolute;border-radius:50%;opacity:.18}
  .cover::before{width:340px;height:340px;background:rgba(255,255,255,.35);top:-120px;left:-90px}
  .cover::after{width:260px;height:260px;background:rgba(255,255,255,.25);bottom:-110px;right:-70px}
  .cover h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:2px;margin-bottom:12px}
  .cover .enter{margin-top:30px;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .cover .enter button{background:#fff;color:var(--green-d);font-weight:700;padding:12px 22px;border-radius:999px;box-shadow:var(--shadow);transition:.2s}
  .cover .enter button:hover{transform:translateY(-2px)}
  .cover-tools{margin-top:22px;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .cover-tools .cv-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.42);font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;transition:.2s}
  .cover-tools .cv-btn:hover{background:rgba(255,255,255,.28)}
  /* scenario reflection note */
  .reflect{font-size:13px;color:#0a7d56;background:#e6f6ef;border:1px dashed var(--green-l);border-radius:10px;padding:10px 12px;margin-top:10px;text-align:left}
  .eg-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:#e6f1fb;padding:2px 9px;border-radius:999px;margin-left:6px}

  /* ===== Top bar ===== */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .progress-wrap{height:4px;background:#e9f1ef}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue-l));transition:width .4s}
  .nav{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:8px 12px}
  .nav .brand{font-weight:800;color:var(--green-d);white-space:nowrap;margin-right:8px;display:flex;align-items:center;gap:6px}
  .nav .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(14,159,110,.2)}
  .nav button.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:.18s}
  .nav button.tab:hover{background:#eaf4f0;color:var(--green-d)}
  .nav button.tab.active{background:var(--green);color:#fff}
  .nav .spacer{flex:1}

  /* ===== Layout ===== */
  main{padding:26px 0 80px;min-height:60vh}
  .fade-in{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .module-title{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .module-title .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--green),var(--blue-l));color:#fff}
  .module-title h2{font-size:24px;font-weight:800}
  .module-desc{color:var(--muted);margin-bottom:22px;font-size:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

  /* Knowledge cards */
  .kcard{padding:18px 18px;cursor:pointer;transition:.2s;border-top:4px solid var(--green);position:relative}
  .kcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(13,80,70,.14)}
  .kcard h3{font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .kcard .tag{font-size:12px;color:var(--green-d);background:#e6f6ef;padding:2px 9px;border-radius:999px;font-weight:700}
  .kcard .sum{color:var(--muted);font-size:14px;line-height:1.85;margin-top:8px}
  .kcard .body{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14.5px;color:#374151}
  .kcard.open .body{display:block}
  .kcard .arrow{position:absolute;top:18px;right:18px;color:var(--green);transition:.2s}
  .kcard.open .arrow{transform:rotate(180deg)}

  /* terms */
  .term{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:#f6faf8;border:1px solid var(--line)}
  .term .en{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.5px}
  .term b{color:var(--green-d)}

  /* Subtopic tabs */
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .subtabs button{padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--muted)}
  .subtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .stage-tabs{display:flex;gap:6px;margin:14px 0}
  .stage-tabs button{flex:1;padding:10px;border-radius:10px;background:#eef5f2;font-weight:700;color:var(--muted);font-size:14px}
  .stage-tabs button.active{background:linear-gradient(135deg,var(--green),var(--blue-l));color:#fff}
  .panel{padding:20px}
  .panel h4{font-size:17px;margin-bottom:10px;color:var(--green-d)}
  .panel p,.panel li{font-size:14.5px;color:#374151;margin-bottom:8px;line-height:1.92}
  .panel ul{padding-left:20px}

  /* Quiz */
  .quiz{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fff}
  .quiz .q{font-weight:700;margin-bottom:10px;font-size:15px}
  .quiz .q .num{color:var(--green);margin-right:6px}
  .quiz .type{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef5f2;color:var(--blue);font-weight:700;margin-left:8px}
  .opt{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:.15s;background:#fff}
  .opt:hover{border-color:var(--green-l)}
  .opt.sel{border-color:var(--green);background:#eafa f3;background:#ebfaef}
  .opt.correct{border-color:var(--green);background:#e6f9ee;font-weight:700}
  .opt.wrong{border-color:var(--red);background:#fdeeee}
  .quiz .explain{display:none;margin-top:10px;padding:12px;border-radius:10px;background:#fff8ec;border:1px solid #fde6c0;font-size:13.5px;color:#7c4a03}
  .quiz .explain.show{display:block}
  .quiz .feedback{font-weight:700;margin-top:8px;font-size:13.5px}
  .btn{display:inline-block;padding:10px 20px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;transition:.18s}
  .btn:hover{background:var(--green-d)}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--blue-l)}

  /* Scenario */
  .sim-box{padding:20px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .field label{font-size:13px;color:var(--muted);font-weight:600}
  .field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .field input:focus,.field select:focus{outline:none;border-color:var(--green-l);box-shadow:0 0 0 3px rgba(14,159,110,.12)}
  .result-line{font-size:14px;background:#f6faf8;border-radius:10px;padding:12px;margin-top:10px;border:1px solid var(--line)}
  .result-line b{color:var(--green-d)}
  .decision-opt{padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;font-weight:600;transition:.15s;background:#fff}
  .decision-opt:hover{border-color:var(--green-l);background:#f1faf6}
  .decision-result{margin-top:12px;padding:14px;border-radius:12px;font-size:14px}
  .decision-result.good{background:#e9f9ef;border:1px solid var(--green-l)}
  .decision-result.mid{background:#fff7e6;border:1px solid #f6d488}
  .decision-result.bad{background:#fdeeee;border:1px solid #f3b4b4}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-left:6px}
  .pill.g{background:#d7f5e2;color:#0a7d56}.pill.r{background:#fbd5d5;color:#b91c1c}.pill.b{background:#dbeafe;color:#1d4ed8}

  /* Charts */
  canvas{max-width:100%;background:#fff;border-radius:12px}
  .chart-card{padding:18px}

  /* Policy */
  .policy-item{padding:16px;border-bottom:1px solid var(--line)}
  .policy-item:last-child{border-bottom:none}
  .policy-item .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
  .policy-item h4{font-size:15.5px;color:var(--blue);margin-bottom:4px}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tagrow span{font-size:11px;background:#eef5f2;color:var(--green-d);padding:2px 9px;border-radius:999px}
  .qa-input{display:flex;gap:8px;margin:10px 0}
  .qa-input input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px}
  .qa-answer{background:#f6faf8;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;margin-top:10px}

  /* Stats */
  .stat{text-align:center;padding:18px 10px}
  .stat .n{font-size:30px;font-weight:800;color:var(--green-d)}
  .stat .l{font-size:13px;color:var(--muted)}
  .wrong-item{padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .wrong-item .q{font-weight:700;font-size:14.5px;margin-bottom:6px}
  .wrong-item .ans{font-size:13px;color:var(--muted)}
  .wrong-item .ans b{color:var(--green-d)}

  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:12px 22px;border-radius:999px;opacity:0;transition:.3s;z-index:200;font-size:14px;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px;border-top:1px solid var(--line)}

  @media(max-width:760px){
    .g2,.g3{grid-template-columns:1fr}
    .module-title h2{font-size:20px}
    .cover{padding:48px 16px 36px}
    .nav .brand span.txt{display:none}
  }
  /* ===== 术语速查 ===== */
  .term-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
  .term-h{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;font-weight:600;color:var(--green-d)}
  .term-h:hover{background:#f4faf7}
  .term-arrow{color:var(--muted);font-size:15px}
  .term-d{display:none;padding:0 14px 12px;color:var(--muted);font-size:14px;line-height:1.75;border-top:1px dashed var(--line);padding-top:10px}
  .term-d.show{display:block}

  /* ===== 标准分类 ===== */
  .cat-box{border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:12px 14px;background:#fff}
  .cat-k{font-weight:700;color:var(--green-d);font-size:14.5px}
  .cat-d{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:4px}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .cmp-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  .cmp-tbl th{background:#eef7f3;color:var(--green-d);font-weight:700;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .cmp-tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.65}
  .cmp-tbl tr:last-child td{border-bottom:none}
  .cmp-tbl .td-std{font-weight:600;color:var(--green-d);white-space:nowrap}

  /* ===== 思维导图 ===== */
  .mind-box{border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,#f6fbf9,#eef6fb);padding:12px;transition:.25s}
  .mind-box.full{position:fixed;inset:36px;z-index:99;overflow:auto;box-shadow:0 24px 60px rgba(3,40,32,.28);background:#fff}
  .mind-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .mind-toolbar .cv-btn{background:#fff;color:var(--green-d);border:1px solid var(--green-l);font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer}
  .mind-toolbar .cv-btn:hover{background:#eef7f3}
  .mind-crumb{font-size:12.5px;color:var(--muted);flex:1;min-width:120px}
  .mind-root{display:flex;justify-content:center;margin-bottom:14px}
  .mind-n{background:#fff;border:1px solid var(--green-l);border-radius:10px;padding:9px 14px;font-size:13.5px;color:#12463a;box-shadow:0 1px 4px rgba(3,40,32,.07);display:flex;flex-direction:column;gap:2px}
  .mind-n.root{background:linear-gradient(135deg,#0E9F6E,#0369A1);color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;min-width:200px;text-align:center;align-items:center;padding:12px 20px}
  .mind-n.root .mind-sub{opacity:.9}
  .mind-n.haschild{cursor:pointer;border-color:var(--blue);border-left:3px solid var(--blue)}
  .mind-n.haschild:hover{background:#f2f8fd;transform:translateY(-1px)}
  .mind-children{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .mind-t{font-weight:600}
  .mind-sub{font-size:12px;color:var(--muted)}
  .mind-n.root .mind-sub{color:rgba(255,255,255,.92)}
  .mind-more{font-size:11.5px;color:var(--blue);margin-top:2px}
  .mind-leaf{text-align:center;color:var(--muted);font-size:13.5px;padding:10px}

  /* ===== 方法学速览 ===== */
  .mth-group{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .mth-gh{background:var(--gc);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .mth-gt{font-weight:700;font-size:14.5px}
  .mth-gtag{font-size:12px;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:999px}
  .mth-items{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;background:#fff}
  .mth-card{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mth-h{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:#fbfdfc}
  .mth-h:hover{background:#f2f9f6}
  .mth-name{flex:1;font-weight:600;font-size:13.5px;color:#12463a;display:flex;flex-direction:column}
  .mth-code{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
  .mth-status{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .mth-status.pub{background:#e6f6ef;color:var(--green-d)}
  .mth-status.draft{background:#fff4e5;color:#b45309}
  .mth-arrow{color:var(--muted);font-size:14px}
  .mth-body{display:none;padding:10px 12px;border-top:1px dashed var(--line);font-size:13px;line-height:1.75;color:var(--muted)}
  .mth-body.show{display:block}
  .mth-line{margin-bottom:6px}
  .mth-line b{color:var(--green-d)}

  /* ===== 操作流程时间线 ===== */
  .flow-tl{position:relative;padding-left:8px}
  .flow-step{display:flex;gap:14px;padding-bottom:18px;position:relative}
  .flow-step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:linear-gradient(180deg,var(--green-l),var(--blue-l,var(--line)))}
  .flow-dot{flex:none;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0E9F6E,#0369A1);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(3,40,32,.18)}
  .flow-body{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .flow-t{font-weight:700;color:var(--green-d);font-size:14.5px}
  /* 知识点正文容器（支持内嵌流程图 / 表格） */
  .panel .kt{font-size:14.5px;color:#374151;margin-bottom:8px;line-height:1.92}
  .panel .kt b{color:var(--green-d)}
  .panel .kt ul{margin:6px 0 8px 18px}
  .panel .kt li{margin-bottom:4px}
  /* 思维导图：标准节点富文本框 */
  .mind-n.doc{cursor:pointer;border-color:var(--green-l);border-left:3px solid var(--green)}
  .mind-n.doc:hover{background:#f2faf6;transform:translateY(-1px)}
  .mind-detail{border:1px solid var(--green-l);border-radius:12px;background:#fff;padding:14px 16px;box-shadow:0 1px 4px rgba(3,40,32,.07)}
  .mind-dt{font-size:16px;font-weight:700;color:var(--green-d);display:flex;flex-direction:column;gap:2px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .mind-ds{font-size:12.5px;color:var(--muted);font-weight:400}
  .mind-db{font-size:14px;line-height:1.9;color:#374151}
  .mind-db b{color:var(--green-d)}
  .mind-dback{margin-top:12px}
  /* 方法学领域行折叠 */
  .mth-gh{cursor:pointer;user-select:none}
  .mth-garr{font-size:14px;opacity:.9}
  .flow-who{font-size:12.5px;color:var(--blue);margin:3px 0 6px}
  .flow-d{font-size:13.5px;color:var(--muted);line-height:1.75}
  .flow-out{margin-top:8px;font-size:13px;color:#12463a;background:#f4faf7;border-left:3px solid var(--green-l);padding:7px 10px;border-radius:0 8px 8px 0;line-height:1.65}
  @media(max-width:640px){
    .mind-children{grid-template-columns:1fr}
    .mth-items{grid-template-columns:1fr}
    .flow-step{gap:10px}
  }
  /* ===== 碳价市场数据表（模块04「市场数据」阶段） ===== */
  .pd-meta{background:linear-gradient(135deg,rgba(14,159,110,.06),rgba(3,105,161,.06));border:1px solid var(--green-l)}
  .pd-meta-row{font-size:13.5px;line-height:1.85;color:var(--ink)}
  .pd-meta-row b{color:var(--green-d)}
  .pd-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .btn.sm{padding:7px 14px;font-size:13px;border-radius:8px}
  .btn.xs{padding:4px 10px;font-size:12px;border-radius:7px}
  .pd-t-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .pd-t-head h4{margin:0}
  .pd-t-btns{display:flex;gap:6px}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  table.price-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px;background:#fff}
  table.price-tbl th{background:linear-gradient(180deg,#eef7f3,#e6f0fb);color:var(--green-d);font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid var(--green-l);white-space:nowrap;position:sticky;top:0}
  table.price-tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
  table.price-tbl tbody tr:hover{background:#f6fbf8}
  table.price-tbl tbody tr:nth-child(even){background:#fafcfe}
  table.price-tbl tbody tr:nth-child(even):hover{background:#f2f9f6}
  table.price-tbl td.td-std{font-weight:700;color:var(--green-d);white-space:nowrap}
  table.price-tbl td:nth-child(n+4){font-variant-numeric:tabular-nums}

    { id:"m00", no:"00", name:"基础认知", icon:"🌱",
      desc:"气候变化科学基础、双碳概念与「3060」目标解读，以及关键术语速查 —— 学习后续各模块前的共同基础",
      knowledge:[
        {t:"一、气候变化科学基础",
         x:"温室气体（CO₂、CH₄、N₂O、HFCs、PFCs、SF₆、NF₃）能吸收地表长波辐射，使地球保持适宜温度，即「温室效应」。工业革命以来，化石燃料燃烧、土地利用变化等人类活动大幅增加大气温室气体浓度，导致全球变暖。<br>政府间气候变化专门委员会（IPCC）评估指出，人类活动已 unequivocally（明确无疑地）造成全球变暖；2011—2020 年全球地表温度比 1850—1900 年高出约 1.1℃。<br>为统一衡量不同温室气体的增温效应，采用「二氧化碳当量（CO₂e）」，以全球增温潜势（GWP）折算：例如 CH₄ 在 100 年尺度下 GWP 约为 27—30，N₂O 约为 273（IPCC AR6）。"},
        {t:"二、碳达峰与碳中和的概念",
         x:"碳达峰：某个地区或行业的二氧化碳年排放量在某一时点达到历史最高值，之后进入平台期并持续下降，这个由增转降的拐点即「达峰」。达峰是过程不是终点。碳中和（净零排放）：在一定时期内，人为温室气体排放量与被人为活动（碳汇、CCUS 等）吸收/清除的量达到平衡，实现净零排放。二者关系：达峰是前提与阶段性目标，中和是最终目标；先达峰、后下降、再中和，缺一不可。<br>需要注意：碳中和强调的是「净零」，不意味着绝对零排放。"},

        {t:"碳足迹", d:"以二氧化碳当量（CO₂e）衡量产品、活动或组织在既定边界内全生命周期（或部分阶段）的温室气体排放总量。常见口径：摇篮到坟墓（全生命周期）、摇篮到大门（至出厂）。"},
        {t:"碳交易", d:"政府设定排放总量并发放配额，控排企业按实际排放清缴配额，余缺部分在市场上买卖，以最低全社会成本完成减排的制度安排。我国有强制碳市场（配额）与自愿减排市场（CCER）两类。"},
        {t:"碳汇", d:"森林、草原、湿地、海洋、土壤等生态系统通过光合作用等过程从大气中吸收并固定 CO₂ 的能力与量。是「吸」的主要形式，也是 CCER 项目的重要类型。"},
        {t:"CCUS", d:"碳捕集、利用与封存（Carbon Capture, Utilization and Storage）。从排放源或空气中捕集 CO₂，加以资源化利用（如驱油、化工原料）或注入地质体封存，是钢铁、水泥等难减排行业深度脱碳的兜底技术。"},
        {t:"ESG", d:"环境（Environmental）、社会（Social）、治理（Governance）三类非财务评价指标。双碳背景下「E」维度权重显著上升，碳排放数据是其核心披露内容（见模块 05）。"},
        {t:"MRV", d:"监测（Monitoring）、报告（Reporting）、核查（Verification）。碳数据可测量、可报告、可核查的质量保障体系，是碳市场公信力的基础。"},
        {t:"绿电 / 绿证", d:"绿电指风电、光伏、水电、核电等几乎不产生碳排放的电力；绿证是可再生能源电力的环境权益凭证。采购绿电或绿证可降低企业范围二排放（见模块 02）。"},
        {t:"碳排放双控", d:"以碳排放总量和强度为核心的双重约束机制。相比「能耗双控」，它不区分能源品种、直接约束碳排放，对高比例可再生能源地区更友好，是双碳阶段的基础管理制度。"}

      cases:[

         x:"《巴黎协定》确立将全球平均气温升幅控制在工业化前水平 2℃ 以内、并努力限制在 1.5℃ 以内的长期目标，要求各方提出并定期更新国家自主贡献（NDC）。中国的 NDC 即包含「2030 年前碳达峰、2060 年前碳中和」等目标。<br>理解这一衔接关系很关键：国际协定提供共同框架与核算规则，国家目标（3060）是其在中国的落地形式，而行业标准、碳市场与企业碳核算（模块 02—05）则是把宏观目标分解到可执行的微观单元。<br>对个人而言，职业路径上的切入点（核算、核查、碳资产、ESG 披露、CBAM 合规等）都在这条分解链的末端。"}

        {id:"m00q2", type:"choice", q:"我国提出「3060」目标：力争哪一年前碳达峰、哪一年前碳中和？", options:["2030 / 2050","2030 / 2060","2035 / 2060","2025 / 2050"], answer:1, explain:"2030 年前碳达峰、2060 年前碳中和，即「3060」目标。"},

        mind:{
          t:"温室气体核算标准体系",
          d:"先定层级、再选标准、后定因子",
          c:[
            {t:"国际体系", d:"ISO / GHG Protocol / IPCC", c:[
              {t:"ISO 14060 系列", d:"温室气体与碳足迹标准族", c:[
                {t:"ISO 14064-1", d:"组织层量化与报告", body:"适用于组织层级温室气体排放与清除的量化和报告。<br>核心要求：设定组织边界（控制权法或股权比例法）与运营边界；识别并区分<b>范围一</b>（直接排放）、<b>范围二</b>（外购电力、热力等能源间接排放）、<b>范围三</b>（价值链其他间接排放）；选择基准年并说明基准年调整规则；按「活动数据 × 排放因子」或物料平衡、实测法量化；对生物源排放单独列示；建立数据质量管理与不确定性控制程序并编制温室气体清单与报告。2018 版强化范围三的细分与信息透明度要求。"},
                {t:"ISO 14064-2", d:"项目层减排与清除", body:"适用于<b>项目层</b>温室气体减排或清除增加的量化、监测与报告，是 CCER、CDM、GS 等项目级机制的方法学母标准。<br>核心要求：识别并论证基准线情景；论证<b>额外性</b>（投资分析 / 障碍分析 / 普遍做法分析）；确定项目边界、计入期与泄漏；处理非持久性风险；按监测计划持续监测并核算减排量，保证可测量、可报告、可核查。"},
                {t:"ISO 14064-3", d:"核查与验证", body:"规定温室气体声明<b>核查与验证</b>的原则与程序。<br>核心要求：核查/验证前进行策略分析与风险评估，制定核查方案；按保证等级（合理保证 / 有限保证）确定证据充分性；确定现场与样地数量；实施文件评审、现场访问与数据交叉核对；形成核查声明并说明不符合项与观察项的处理。与 ISO 14065（机构要求）、ISO 14066（人员能力）配套使用。"},
                {t:"ISO 14065", d:"核查机构要求", body:"对从事温室气体核查、验证机构的要求：法律地位与治理结构、<b>公正性与独立性</b>、保密性、人员能力、分包与记录管理、信息公开。是核查机构获得认可、开展第三方核查业务的机构层面依据。"},
                {t:"ISO 14067", d:"产品碳足迹", body:"规定<b>产品碳足迹（CFP）</b>的量化与信息交流，以生命周期评价（ISO 14040/14044）为基础。<br>核心要求：明确功能单位（如 1 吨产品、1 件商品）与系统边界（摇篮到坟墓或摇篮到大门）；收集初级数据与次级数据并评价数据质量；处理共产品分配（优先避免分配，其次按物理或经济关系分配）；按 GWP100 折算 CO₂e；出具碳足迹研究报告或碳标签声明，部分碳足迹须明确标注截断的生命周期阶段。"}
              ]},
              {t:"GHG Protocol", d:"温室气体核算体系", c:[
                {t:"企业核算与报告准则", d:"范围一 / 二 / 三", body:"《温室气体核算体系：企业核算与报告准则》（2004 年，2015 年修订范围二）确立范围一 / 二 / 三框架，是 ISO 14064-1 与各国核算指南的重要基础。核心要求：设定组织与运营边界；<b>范围二须同时按地点法与市场法两种方式报告</b>；编制跨年度清单并设定基准年；区分直接排放与间接排放，避免重复计算。"},
                {t:"产品生命周期标准", d:"与 ISO 14067 衔接", body:"《产品生命周期核算与报告标准》（2011 年）：规定产品全生命周期温室气体清单的编制与报告，与 ISO 14067 高度衔接。核心要求：确定功能单位与产品系统边界，绘制全生命周期流程图，按阶段收集活动数据并核算，识别对结果影响显著的数据并优先提升其质量。"},
                {t:"价值链（Scope 3）标准", d:"15 类上下游排放", body:"《企业价值链（范围三）核算与报告标准》（2011 年）：将价值链其他间接排放划分为 <b>15 个类别</b>（上游 8 类：采购商品与服务、资本品、燃料与能源相关活动、运输与配送、运营废弃物、商务差旅、员工通勤、上游租赁资产；下游 7 类：下游运输与配送、售出产品加工、售出产品使用、售出产品报废处理、下游租赁资产、特许经营、投资）。要求先做类别筛选与边界界定，再按活动数据 × 排放因子核算。"}
              ]},
              {t:"IPCC 国家清单指南", d:"分层方法 Tier 1 / 2 / 3", c:[
                {t:"Tier 1", d:"缺省因子法", body:"使用 IPCC 指南提供的<b>缺省排放因子</b>与国家或国际统计活动数据。方法最简单、数据要求最低、不确定性相对较大，适用于本国或本区域参数缺失的排放类别，或作为交叉校核的参照。"},
                {t:"Tier 2", d:"本国/本地化参数", body:"使用<b>本国 / 本区域分部门参数</b>替代缺省值（如本地煤种的元素碳含量与低位发热量、分炉型碳氧化率、本地牲畜肠道发酵因子）。精度较 Tier 1 显著提升，是多数国家主要排放类别的常规做法。"},
                {t:"Tier 3", d:"精细化模型与实测", body:"使用<b>精细化模型、逐源实测或高分辨率数据</b>（如连续监测系统 CEMS、企业级实测因子、模型同化与遥感反演），并开展不确定性分析。精度最高、成本与能力要求也最高，通常用于关键排放源或需要高质量数据的场景。"}
              ]}
            ]},
            {t:"国内体系", d:"国标 + 行业指南", c:[
              {t:"GB/T 32150-2015", d:"工业企业温室气体排放核算和报告通则", body:"《工业企业温室气体排放核算和报告通则》，工业企业碳核算的基础性国家标准。<br>核心内容：界定核算边界（主要生产系统、辅助生产系统、附属生产系统）；规定核算流程——识别排放源 → 选择核算方法 → 收集活动数据与排放因子 → 计算排放量（活动数据 × 排放因子）→ 编制报告；明确数据质量管理、不确定性与报告内容要求。是 GB/T 32151 分行业系列标准的上位通用标准。"},
              {t:"GB/T 32151.1~17", d:"分行业温室气体核算与报告要求", body:"分行业温室气体核算与报告要求系列国家标准，覆盖发电、电网、钢铁、有色金属、建材（水泥 / 平板玻璃 / 陶瓷）、煤炭、化工、石油天然气、民用航空、公共建筑运营单位等 <b>17 个部分</b>。各部分统一规定：核算边界与排放源清单、活动数据的获取与监测要求、排放因子缺省值、数据质量控制计划、核算公式与报告格式。"},
              {t:"行业核算与报告指南", d:"生态环境部随碳市场扩围陆续发布", body:"生态环境部随全国碳市场扩围发布的<b>行业核算与报告指南</b>（发电设施、钢铁、水泥、铝冶炼等），是配额分配与履约清缴的数据基础。内容包含核算边界与排放源、活动数据与排放因子的获取与实测要求、数据质量控制计划与月度存证要求，通常与配套的「核查技术指南」成对发布并动态更新。"},
              {t:"行业核查技术指南", d:"如钢铁行业（2025 年 1 月）", body:"《企业温室气体排放核查技术指南》系列（如发电设施、钢铁行业，2025 年 1 月发布）。核心内容：核查程序（准备、文件评审、现场核查、报告编制）、核查要点（边界与排放源完整性、活动数据与因子适用性、计算准确性）、交叉核对方法（如能耗台账与财务数据比对）、不符合项与观察项的判定与处理。"}
            ]},
            {t:"排放因子与参数", d:"换算系数来源", c:[
              {t:"区域电网排放因子", d:"生态环境部发布，分区域", body:"生态环境部（会同国家统计局、国家能源局等）逐年公布的<b>区域电网排放因子</b>，分华北、东北、华东、华中、西北、西南、南方等电网区域发布，是企业计算范围二（外购电力）排放的首选因子。使用时应注明发布年份与文号（如 2023 年电力二氧化碳排放因子公告，公告 2025 年第 47 号）。"},
              {t:"省级清单指南缺省值", d:"", body:"《省级温室气体清单编制指南》（2025 年版，环办气候〔2026〕1 号）提供能源活动、工业生产过程和产品使用、农业活动、土地利用变化和林业、废弃物处理五大领域的清单编制方法与<b>缺省参数</b>，是省级清单编制与区域碳考核的统一口径。"},
              {t:"IPCC EFDB", d:"国际缺省因子数据库", body:"IPCC 排放因子数据库（Emission Factor Database）：汇集国际文献与各国清单中的排放因子及其不确定区间，作为国家或区域因子缺失时的兜底参考。使用时须注明因子来源、适用条件与年限。"},
              {t:"实测 / 检测值", d:"优先级最高", body:"优先级最高的因子来源：燃煤元素碳含量实测、燃气组分分析、物料平衡计算、CEMS 连续监测与第三方检测报告。使用实测值须满足相应标准规定的采样频次、检测方法与计量器具检定要求，并保留原始记录备查。"}
            ]}
          ]
        }
      },
      quiz:[
        {id:"m02q1", type:"choice", q:"GB/T 32150-2015 的标准名称是？", options:["工业企业温室气体排放核算和报告通则","建筑防火设计规范","食品安全国家标准","温室气体 产品碳足迹"], answer:0, explain:"GB/T 32150-2015《工业企业温室气体排放核算和报告通则》是企业碳核算的基础性国家标准。"},
        {id:"m02q2", type:"choice", q:"GB/T 32151 系列标准的作用是？", options:["分行业规定温室气体核算与报告要求","规定碳排放配额分配方法","规定碳市场交易规则","规定产品碳标签样式"], answer:0, explain:"GB/T 32151.1~17 覆盖电网、有色金属、钢铁、民航、建材、煤炭、化工、公共建筑运营等重点行业的核算与报告要求。"},
        {id:"m02q3", type:"choice", q:"企业外购电力产生的间接排放，在温室气体核算体系中属于？", options:["范围一","范围二","范围三","不计入"], answer:1, explain:"范围一为直接排放；范围二为外购电力/热力等能源的间接排放；范围三为价值链其他间接排放。"},
        {id:"m02q4", type:"choice", q:"碳排放量核算最基本的公式是？", options:["活动数据 × 排放因子","产量 ÷ 用电量","员工人数 × 面积","利润 × 碳价"], answer:0, explain:"排放量 = 活动数据（能耗、里程等）× 排放因子，是碳核算最核心的算式。"},
        {id:"m02q5", type:"choice", q:"ISO 14064 系列标准主要用于？", options:["组织与项目层面温室气体核算、量化与验证","产品质量检验","财务报表审计","员工绩效考核"], answer:0, explain:"ISO 14064-1/-2/-3 分别规范组织层、项目层温室气体量化与核查验证。"},
        {id:"m02q6", type:"judge", q:"GHG Protocol（温室气体核算体系）是企业碳核算领域应用最广泛的国际标准之一。", options:["正确","错误"], answer:0, explain:"GHG Protocol 提出范围一/二/三框架，是 ISO 14064 与各国核算指南的重要基础。"},
        {id:"m02q7", type:"choice", q:"我国区域电网排放因子呈现明显差异，通常表现为？", options:["西南电网（水电占比高）因子较低","华北电网因子最低","各区域完全相同","与电源结构无关"], answer:0, explain:"水电、核电、风光占比高的区域（如西南）电网因子低；煤电占比高的区域因子高。"},
        {id:"m02q8", type:"judge", q:"排放因子是固定不变的常数，可长期使用不需更新。", options:["正确","错误"], answer:1, explain:"排放因子随电源结构、技术进步与统计口径逐年更新，应使用最新公布值并注明年份与来源。"},
        {id:"m02q9", type:"judge", q:"IPCC 清单指南的分层方法中，Tier 越高通常代表方法与数据的精细化程度越高。", options:["正确","错误"], answer:0, explain:"Tier 1 使用缺省因子，Tier 2/3 逐步采用本国/本企业实测参数，精度逐级提高。"}
      ]
    },

    /* ============ 03 CCER自愿减排方法学 ============ */
    { id:"m03", no:"03", name:"CCER 自愿减排方法学", icon:"🌲",
      desc:"CCER 方法学体系与项目开发依据 ｜ 对应知识库「03 CCER自愿减排方法学」：26 项资料 · 8/19 更新",
      knowledge:[
        {t:"方法学体系与领域划分",
         x:"CCER 方法学按领域划分：能源产业、建筑业、农业、林业和其他碳汇、燃料（固体、石油和天然气）逸散性排放、卤烃与六氟化硫生产使用逸出性排放、交通运输业和能源需求等。知识库收录的正式发布方法学包括：造林碳汇（CCER-14-001-V01）、规模化猪场粪污沼气回收利用工程（CCER-15-001-V01）、农业废弃物集中处理工程（CCER-15-002-V01）、淤地坝碳汇（CCER-14-005-V01）、煤矿低浓度瓦斯和风排瓦斯利用（CCER-10-001-V01）、中深层地热能井下换热供暖（CCER-01-003-V01）、公路隧道照明系统节能（CCER-07-001-V01）等；<br>另收录少量征求意见稿（如更新造林碳汇、纯农林生物质并网发电 / 热电联产等）；截至 2026 年 9 月，生态环境部已正式发布的方法学达 18 项，详见本模块「方法学速览」。"},
        {t:"造林碳汇方法学（CCER-14-001-V01）要点",
         x:"造林碳汇项目通过增加森林面积和森林生态系统碳储量实现二氧化碳清除。适用条件：<br>① 适用于乔木、竹子和灌木造林（防护林、特种用途林、用材林等），不包括经济林造林、非林地上的通道绿化、城镇村及工矿用地绿化；<br>② 项目土地在项目开始前至少三年为不符合森林定义的土地。知识库另收录该方法学修订征求意见稿及编制说明——本次修订以降低实施难度、增强可操作性为导向。"},
        {t:"农业与沼气类方法学",
         x:"规模化猪场粪污沼气回收利用工程（CCER-15-001-V01）、农业废弃物集中处理工程（CCER-15-002-V01）：利用厌氧消化反应器处理粪污/秸秆等农业废弃物，避免贮存环境中的甲烷（CH₄）排放；回收的甲烷用于发电、供沼气、生产生物天然气，替代化石燃料减少 CO₂ 排放，实现减污降碳协同增效。"},

        {t:"CCER 项目开发全流程（十个环节）",
         x:`<div class="kt">全国温室气体自愿减排项目开发遵循《温室气体自愿减排交易管理办法（试行）》与《温室气体自愿减排项目设计与实施指南》（国家气候战略中心，2023 年 11 月）确立的流程，可归纳为十个环节。<br>项目与减排量须同时满足 <b>真实性、额外性、唯一性、保守性</b> 四项基本要求：真实性即减排量真实存在且准确可靠；额外性即项目实施有助于克服内部收益率、融资或关键技术障碍；唯一性即未参与其他温室气体减排交易机制、不存在重复认定或重复计算；<br>保守性即在难以精准判断时采用保守方式取值，确保减排量不被高估。</div>\n<div class="flow-tl">\n  <div class="flow-step"><div class="flow-dot">1</div><div class="flow-body"><div class="flow-t">项目评估</div><div class="flow-who">👤 项目业主 / 咨询机构</div><div class="flow-d">对照生态环境部已发布的方法学判断项目是否属于支持领域，初判<b>真实性</b>与<b>唯一性</b>（未参与其他减排机制）、判断额外性论证路径，粗算减排量规模并测算开发成本与收益。<br></div><div class="flow-out"><b>输出 / 交付物：</b>项目可行性判断与开发决策</div></div></div>\n  <div class="flow-step"><div class="flow-dot">2</div><div class="flow-body"><div class="flow-t">收集资料</div><div class="flow-who">👤 项目业主</div><div class="flow-d">收集项目立项与批复、土地/林权权属证明、环评与竣工验收、能源与物料台账、计量器具检定证书、减排量唯一性声明等支撑材料。<br>项目设计文件所涉数据和信息的原始记录、管理台账须在该项目最后一期减排量登记后<b>至少保存 10 年</b>。</div><div class="flow-out"><b>输出 / 交付物：</b>项目资料清单与底稿台账</div></div></div>\n  <div class="flow-step"><div class="flow-dot">3</div><div class="flow-body"><div class="flow-t">编写 PDD</div><div class="flow-who">👤 项目业主 / 咨询机构</div><div class="flow-d">按《设计与实施指南》附 3（避免、减少排放类项目）或附 4（林业和其他碳汇类型）模板编制<b>项目设计文件（PDD）</b>，说明项目边界、计入期、基准线情景识别、额外性论证（免予论证或按「额外性论证工具」一般论证）、减排量核算方法与监测计划。<br></div><div class="flow-out"><b>输出 / 交付物：</b>项目设计文件（PDD）</div></div></div>\n  <div class="flow-step"><div class="flow-dot">4</div><div class="flow-body"><div class="flow-t">项目公示</div><div class="flow-who">👤 项目业主（注册登记系统）</div><div class="flow-d">通过全国温室气体自愿减排注册登记系统公示项目设计文件，<b>公示期 20 个工作日</b>，并同步公示所委托的审定与核查机构名称；<br>公示期间公众可通过系统提出意见，项目业主须逐条回应。</div><div class="flow-out"><b>输出 / 交付物：</b>公示凭证与公众意见处理说明</div></div></div>\n  <div class="flow-step"><div class="flow-dot">5</div><div class="flow-body"><div class="flow-t">项目审定</div><div class="flow-who">👤 审定与核查机构</div><div class="flow-d">机构按《审定与减排量核查实施规则》对法律法规符合性、方法学支持领域、方法学选用得当性、真实性/唯一性/额外性、可持续发展影响等事项进行审定，出具<b>项目审定报告</b>并上传系统向社会公开。<br>自公示之日起至出具报告<b>原则上不超过 100 天</b>。</div><div class="flow-out"><b>输出 / 交付物：</b>项目审定报告（含肯定/否定结论）</div></div></div>\n  <div class="flow-step"><div class="flow-dot">6</div><div class="flow-body"><div class="flow-t">项目登记</div><div class="flow-who">👤 注册登记机构（国家气候战略中心）</div><div class="flow-d">项目业主提交项目申请表、PDD、项目审定报告及承诺书；<br>注册登记机构审核材料的<b>完整性与规范性</b>，自收到申请材料之日起 <b>15 个工作日内</b>完成登记，并向社会公开项目登记情况及全部材料。</div><div class="flow-out"><b>输出 / 交付物：</b>项目登记（取得项目登记编号）</div></div></div>\n  <div class="flow-step"><div class="flow-dot">7</div><div class="flow-body"><div class="flow-t">项目监测</div><div class="flow-who">👤 项目业主</div><div class="flow-d">按 PDD 确定的监测计划持续监测项目边界、活动数据与关键参数；<br>可自行监测或委托专业调查机构，须建立可信透明的内部管理制度与质量保障体系，指定专人负责数据记录与<b>交叉核对</b>。</div><div class="flow-out"><b>输出 / 交付物：</b>监测记录、数据台账与质控记录</div></div></div>\n  <div class="flow-step"><div class="flow-dot">8</div><div class="flow-body"><div class="flow-t">减排量核算</div><div class="flow-who">👤 项目业主</div><div class="flow-d">按方法学编制<b>减排量核算报告</b>。<br>减排量须产生于 2020 年 9 月 22 日之后，且每期申请登记的减排量产生时间应在申请登记之日前 <b>5 年以内</b>，可分期申请。</div><div class="flow-out"><b>输出 / 交付物：</b>减排量核算报告</div></div></div>\n  <div class="flow-step"><div class="flow-dot">9</div><div class="flow-body"><div class="flow-t">减排量核查</div><div class="flow-who">👤 审定与核查机构</div><div class="flow-d">机构核查核算报告的合规性、真实性与准确性并出具<b>减排量核查报告</b>；<br>核算报告同样须公示 <b>20 个工作日</b>。<b>项目业主不得委托负责该项目审定的机构开展同一项目的减排量核查</b>。</div><div class="flow-out"><b>输出 / 交付物：</b>减排量核查报告</div></div></div>\n  <div class="flow-step"><div class="flow-dot">10</div><div class="flow-body"><div class="flow-t">减排量登记</div><div class="flow-who">👤 注册登记机构</div><div class="flow-d">注册登记机构审核通过后登记<b>核证自愿减排量（CCER）</b>。<br>登记后的 CCER 可在交易系统以挂牌协议、大宗协议或单向竞价方式交易，也可用于全国碳市场配额清缴抵销（须符合抵销比例要求）或自愿注销。</div><div class="flow-out"><b>输出 / 交付物：</b>CCER 登记（可交易 / 可抵销 / 可注销）</div></div></div>\n</div>`},

          {domain:"领域 06 · 建筑业（能源需求）", tag:"CCER-06", color:"#0369A1", items:[
            {code:"CCER-06-001-V01", name:"既有公共建筑围护结构与供暖通风空调系统能效提升", status:"已发布", date:"2025-12-23",
             cond:"适用于办公、旅馆、商场、文教、医疗、观演、交通、体育、博览等既有公共建筑，开展外墙保温改造、墙内保温改造、加换窗户、幕墙和采光顶更换、冷水机组更换、热泵机组更换、多联式空调机组更换等成本较高的节能改造项目。",
             calc:"减排量 = 改造前后建筑运行能耗之差 × 对应能源（电力／燃气／热力）排放因子。须处理气候修正与使用强度归一化，并以改造前的实际能耗或基准模型确定基线。"}
          ]},
          {domain:"领域 07 · 交通运输业、能源需求", tag:"CCER-07", color:"#7C3AED", items:[
            {code:"CCER-07-001-V01", name:"公路隧道照明系统节能", status:"已发布", date:"2025-01-03",

             calc:"减排量 =（基线照明电耗 − 项目照明电耗）× 区域电网排放因子。基线电耗按既有灯具功率与运行时间确定，项目电耗须实测或连续监测。"}

          {domain:"领域 10 · 燃料（固体、石油和天然气）的逸散性排放", tag:"CCER-10", color:"#F59E0B", items:[
            {code:"CCER-10-001-V01", name:"甲烷体积浓度低于 8% 的煤矿低浓度瓦斯和风排瓦斯利用", status:"已发布", date:"2025-01-03",
             cond:"适用于甲烷体积浓度低于 8% 的煤矿低浓度瓦斯和风排瓦斯利用项目；瓦斯须进行分解销毁，并利用分解产生的热能发电或供热。",
             calc:"减排量 = 销毁甲烷对应的 CO₂e + 替代区域电网发电／既有供热的减排量 − 项目能耗排放。销毁甲烷量按瓦斯流量与浓度监测数据确定，乘以甲烷 GWP 折算 CO₂e。"},
            {code:"CCER-10-002-V01", name:"海上油田伴生气回收利用", status:"已发布", date:"2025-11-21",
             cond:"适用于海上油田产生的伴生气，回收的伴生气用于生产管输天然气、液化天然气、压缩天然气、液化石油气等产品。",
             calc:"减排量 = 避免火炬燃烧／放空产生的排放 + 替代化石燃料的减排 − 项目排放。按回收气量、气体组分与燃烧／回收效率核算。"},
            {code:"CCER-10-003-V01", name:"陆上气田试气放喷气回收利用", status:"已发布", date:"2025-11-21",
             cond:"适用于常规天然气井、页岩气井和致密气井的试气放喷阶段，回收的试气放喷气处理为管输天然气、压缩天然气、液化天然气等产品。",
             calc:"减排量 = 避免试气放喷直接排放（甲烷为主）+ 替代化石燃料的减排 − 项目排放。按回收气量、组分与甲烷 GWP 折算 CO₂e。"},
            {code:"CCER-10-004-V01", name:"陆上油田低气量伴生气回收利用", status:"已发布", date:"2025-11-21",
             cond:"适用于陆上油田产生的伴生气，且同一站场内伴生气处理系统设计总规模小于 3 万立方米／天；回收气用于生产管输天然气、液化天然气、压缩天然气、液化石油气、稳定轻烃、混烃等产品。",
             calc:"减排量 = 避免伴生气放空／火炬燃烧排放 + 替代化石燃料的减排 − 项目排放。按回收气量、组分与回收工艺能耗核算。"}

             calc:"减排量 = 回收净化并回用的 SF₆ 量 × SF₆ 的 GWP（数值按方法学取值，约 24300）− 回收净化处理过程排放。"}
          ]},
          {domain:"领域 14 · 林业和其他碳汇类型", tag:"CCER-14", color:"#059669", items:[
            {code:"CCER-14-001-V01", name:"造林碳汇", status:"已发布", date:"2023-10-24",
             cond:"适用于乔木、竹子和灌木造林（防护林、特种用途林、用材林等）；不包括经济林造林。项目土地在项目开始前至少三年为不符合森林定义的土地，权属清晰，单个地块连续面积不小于 400㎡（2019 年及以前开始的项目不小于 667㎡），且不属于湿地。计入期最短 20 年、最长 40 年。",
             calc:"净碳汇量 = 项目碳汇量 − 基线碳汇量 − 泄漏量，并按方法学设定扣除非持久性风险（扣减率 10%）。项目碳汇量按碳层分层抽样设置样地，实测胸径／树高等因子，代入生物量方程或蓄积量—生物量转换因子计算各碳库（地上／地下生物量、枯落物、枯死木、土壤有机碳）碳储量变化，再乘以 44/12 折算 CO₂e。<br>年均降水量≤400mm 地区、国家重点生态功能区、生态公益林三类项目可免予额外性论证。2026 年 6 月已发布修订征求意见稿，拟放宽地类限制、全面免予额外性论证并简化核算。"},
            {code:"CCER-14-002-V01", name:"红树林营造", status:"已发布", date:"2023-10-24",

             calc:"净碳汇量 = 项目碳汇量（植被生物量碳 + 沉积物埋藏碳）− 基线碳汇量 − 泄漏量，并扣除非持久性风险。修订征求意见稿拟全面免除红树林项目的额外性论证。"},
            {code:"CCER-14-003-V01", name:"滨海盐沼植被修复", status:"已发布", date:"2025-12-03",
             cond:"适用于在无植被滩涂，以及清退废弃、非法海洋工程、海水养殖等人为活动后的滩涂上人工种植盐沼植被的项目。",
             calc:"净碳汇量 = 项目碳汇量（植被碳 + 沉积物有机碳）− 基线碳汇量 − 泄漏量，并考虑非持久性风险。按分层取样测定植被生物量与沉积物有机碳含量、容重。"},
            {code:"CCER-14-004-V01", name:"海草床植被修复", status:"已发布", date:"2025-12-03",
             cond:"适用于在适宜海草生长的潮间带或潮下带区域人工种植海草床植被的项目。",
             calc:"净碳汇量 = 项目碳汇量（海草植被生物量碳 + 沉积物有机碳）− 基线碳汇量 − 泄漏量，并考虑非持久性风险。核算方法与滨海盐沼相近。"},
            {code:"CCER-14-005-V01", name:"淤地坝碳汇", status:"已发布", date:"2025-12-02",
             cond:"适用于按水利行业淤地坝技术规范（SL/T 804）建设的淤地坝项目，坝地可种植作物或水土保持林；项目边界内的淤地坝须符合技术规范要求。",
             calc:"减排量 =（保土保碳 + 减蚀减排 + 增绿增汇）项目碳汇量 − 基线情景碳储量变化。以淤积泥沙中有机碳储量与坝体植被固碳量为主要核算对象，按分层取样测定土壤有机碳含量与容重。"},
            {code:"待发布", name:"更新造林碳汇", status:"征求意见稿", date:"2026-08-13",
             cond:"面向已有林分的更新造林增汇项目，具体适用条件以正式发布稿为准（环办便函〔2026〕265 号公开征求意见）。",
             calc:"待正式发布。核算思路参照造林碳汇：项目情景与基线情景碳储量变化之差，扣除泄漏与非持久性风险。"}
          ]},
          {domain:"领域 15 · 农业", tag:"CCER-15", color:"#65A30D", items:[
            {code:"CCER-15-001-V01", name:"规模化猪场粪污沼气回收利用工程", status:"已发布", date:"2025-12-17",
             cond:"适用于使用厌氧消化反应器处理规模化猪场粪污，并对所产生的沼气进行回收利用的项目；沼气须用于发电、供应沼气或生产生物天然气等。",
             calc:"减排量 = 基准线排放 − 项目排放 − 泄漏。基准线排放主要为粪污在厌氧贮存环境中产生的 CH₄（按挥发性固体 VS 与最大 CH₄ 产生能力 B₀ 计算）；项目排放为沼气燃烧／未利用逸散与工程能耗；替代化石燃料（发电／供热）的减排另行计入，按 GWP 折算 CO₂e。"},
            {code:"CCER-15-002-V01", name:"农业废弃物集中处理工程", status:"已发布", date:"2025-12-17",

             calc:"减排量 = 避免的 CH₄ 排放 + 替代化石能源减排 − 项目排放。以废弃物处理量、有机碳含量与厌氧降解率估算甲烷产生量，按 GWP 折算 CO₂e。"}
          ]}
        ]

         x:"2024 年 4 月 12 日，上交所发布《自律监管指引第 14 号——可持续发展报告（试行）》、深交所发布《自律监管指引第 17 号——可持续发展报告（试行）》（深证上〔2024〕284 号，适用于主板、创业板）、北交所发布《持续监管指引第 11 号——可持续发展报告（试行）》（2025 年 4 月 25 日第一次修订），自 2024 年 5 月 1 日起实施。<br>2025 年 1 月，沪深北交易所进一步发布《上市公司可持续发展报告编制指南》，并明确强制披露主体应当在 2026 年 4 月 30 日前发布 2025 年度可持续发展报告。"},
        {t:"国家统一的可持续披露准则体系",
         x:"2024 年 11 月 20 日，财政部会同外交部、国家发展改革委、工业和信息化部、生态环境部、商务部、中国人民银行、国务院国资委、金融监管总局、中国证监会等八部门联合印发《企业可持续披露准则——基本准则（试行）》，首次建立全国统一的企业可持续信息披露标准体系；<br>在实施范围及实施要求作出规定之前，由企业自愿实施。2025 年 4 月 30 日，财政部与生态环境部联合发布《企业可持续披露准则第 1 号——气候（试行）（征求意见稿）》（财办会〔2025〕17 号），围绕治理、战略、风险和机遇管理、指标和目标四要素构建，与 IFRS S2 总体趋同，并同步为电力、钢铁、煤炭、石油、化肥、铝、氢、水泥、汽车等 9 个行业编制应用指南。"},
        {t:"国际衔接：ISSB 与联合国 SDGs",
         x:"ISSB 于 2023 年 6 月 26 日发布 IFRS S1《可持续相关财务信息披露一般要求》与 IFRS S2《气候相关披露》，自 2024 年 1 月 1 日或之后开始的年度报告期生效。<br>TCFD 已于 2023 年 10 月解散，其气候相关披露进展的监测工作由 IFRS 基金会承接；SASB 准则亦已由 ISSB 承接维护。联合国《2030 年可持续发展议程》确立 17 项可持续发展目标（SDGs），是 ESG 报告中「贡献度对标」的常用框架。"},
        {t:"全球 ESG 披露标准的三层格局",
         x:"当前国际 ESG 披露标准可粗略分为三层：<br>① 投资者导向的「财务重要性」全球基线——以 ISSB（IFRS S1/S2）为核心，配合 SASB 行业指标与 TCFD 四支柱；<br>② 多利益相关方导向的「影响重要性」报告——以 GRI 标准为代表，被广泛用于面向社会与价值链沟通；<br>③ 司法辖区强制披露——欧盟 CSRD/ESRS（双重重要性）、中国沪深北交易所指引与香港联交所 ESG 守则。三者之间已通过互操作性文件实现一定程度的对照与衔接。"},

      esgList:{intro:"以下罗列当前主流的 ESG / 可持续披露标准与指南。每项均标注发布机构、适用对象与地区、强制或自愿属性；点击任一张卡片可展开其内容框架、简要描述与重点要求（核心议题、关键指标、披露口径、实施时间）。",

      items:[
        {key:"gri", name:"GRI 可持续发展报告标准", abbr:"GRI", org:"全球可持续发展标准委员会（GSSB）／全球报告倡议组织（GRI）",
         region:"国际通用", g:"国际通用", nature:"自愿（被多国监管体系引用或认可）", nlv:2,
         scope:"面向所有类型与规模的组织（企业、政府机构、NGO）；以「组织对经济、环境与人（含人权）的影响」为披露主线，是全球使用范围最广的多利益相关方报告标准。",
         desc:"GRI 标准采用模块化结构：三项通用标准 + 议题（Topic）标准 + 行业（Sector）标准。组织须先按 GRI 1 确定报告要求，按 GRI 2 披露组织概况与治理，再按 GRI 3 完成实质性议题判定，最后按 GRI 200（经济）／300（环境）／400（社会）系列逐议题披露管理方法与指标。<br>其重要性判定为「影响重要性」，即看组织经营活动对环境与社会的实际／潜在影响程度，与 ISSB 的财务重要性形成互补。",
         framework:["GRI 1 基础 2021：准则体系构成、报告原则与「按 GRI 标准编制」的声明要求","GRI 2 一般披露 2021：组织及其报告做法、治理、战略、政策与尽职调查、利益相关方参与","GRI 3 实质性议题 2021：议题清单确定、优先级排序与「如何管理」披露","GRI 200 经济 / 300 环境 / 400 社会：议题标准（每个议题含「管理方法 disclosures」与议题专项指标）","GRI Sector Standards：行业准则（已发布石油与天然气、煤炭、农业水产养殖与渔业等）"],
         topics:["环境（GRI 300）：物料 301、能源 302、水资源与污水 303、生物多样性 304、排放 305、废弃物 306、供应商环境评估 308","社会（GRI 400）：雇佣 401、劳资关系 402、职业健康安全 403、培训与教育 404、多元化与反歧视 405、反童工 408、反强迫劳动 409、当地社区 413、客户健康与安全 416、客户隐私 418","经济与治理（GRI 200）：经济绩效 201、间接经济影响 203、采购实践 204、反腐败 205、反竞争行为 206、税务 207"],
         metrics:["GRI 305-1 直接（范围一）温室气体排放；305-2 能源间接（范围二）；305-3 其他间接（范围三）","GRI 305-4 温室气体排放强度；305-5 温室气体减排量","GRI 302-1 组织内部能源消耗量；302-3 能源强度","GRI 303-3 取水量；303-4 排水量；303-5 耗水量","GRI 306-3 产生的废弃物；306-4 转移处置的废弃物；306-5 直接处置的废弃物","GRI 403-9 工伤；403-10 职业病","GRI 405-1 治理机构与员工的多元化","GRI 418-1 经证实的侵犯客户隐私投诉"],
         caliber:["重要性口径：影响重要性（impact materiality），以影响的严重程度与发生可能性排序","报告边界：按控制法确定（财务控制或运营控制），与财务报表边界可不一致但须说明","须披露报告期、报告边界与边界变更、信息重述、外部鉴证情况；不得选择性隐瞒负面信息（平衡性原则）","引用须声明「本报告已参照 GRI 标准编制」或「按 GRI 标准编制」（后者须满足全部适用要求）"],
         time:["GRI Standards 2021 版于 2021 年 10 月发布，自 2023 年 1 月 1 日及之后开始的报告期起强制替代 2016/2018 版","2024 年 GRI 与 ISSB 联合发布互操作性指引；GRI 与 EFRAG 亦就 GRI—ESRS 对应关系发布对照文件"],
         src:[{n:"GRI Standards 官方页面", u:"https://www.globalreporting.org/standards/"},{n:"GRI 中文站", u:"https://www.globalreporting.org/"}]

        {key:"s1", name:"IFRS S1 可持续相关财务信息披露一般要求", abbr:"IFRS S1", org:"国际可持续准则理事会（ISSB）／IFRS 基金会",
         region:"国际通用", g:"国际通用", nature:"自愿（是否强制由各司法辖区决定）", nlv:2,
         scope:"适用对象为编制通用目的财务报告的主体（含上市公司与非上市主体，以及公共部门的经营性主体）；目标是建立面向投资者与债权人的全球可持续披露基线。",
         desc:"IFRS S1 是 ISSB 的基础性准则，规定可持续相关财务信息披露的一般要求。它沿用 TCFD 的四支柱结构（治理、战略、风险管理、指标与目标），要求主体披露可合理预期影响其短期、中期或长期现金流量、融资渠道或资本成本的可持续相关风险与机遇信息，并强调可持续信息与财务报表之间的「关联性」（connected information）。是否强制取决于各辖区监管采纳，ISSB 自身无强制权。",
         framework:["概念基础：公允反映、重要性、报告主体、关联信息","核心内容四支柱：治理 — 战略 — 风险管理 — 指标与目标","通用要求：指引来源、报告时间、可比信息、合规声明","判断、不确定性与差错：计量不确定性的来源与假设说明"],
         topics:["覆盖全部可持续相关议题（气候、自然、人力资本、供应链、商业行为等），以「是否对主体前景产生财务影响」为筛选门槛","具体议题的详细指标由其他准则（如 IFRS S2 气候）或 SASB 行业指标提供"],
         metrics:["行业通用指标与行业特定指标（行业指标参照 SASB 准则及《IFRS S2 行业披露指南》）","主体自设目标或法律法规要求目标的进展","须说明计量方法、输入数据、假设及其局限性"],
         caliber:["重要性口径：财务重要性（与 IFRS 会计准则中的「重要信息」定义一致），服务于通用目的财务报告使用者","报告主体与相关财务报表主体一致；报告时间与财务报表同期","相称性机制：允许使用「无需付出过度成本或努力即可获得的合理且可支持的信息」","首年过渡豁免：可仅披露气候相关风险与机遇、可不提供可比信息、可在财务报表后披露"],
         time:["2023 年 6 月 26 日发布；自 2024 年 1 月 1 日或之后开始的年度报告期生效，允许提前采用","提前采用须同时采用 IFRS S1 与 IFRS S2 并披露事实"],
         src:[{n:"IFRS 基金会 ISSB 准则页面", u:"https://www.ifrs.org/issued-standards/ifrs-sustainability-standards-navigator/"},{n:"财政部会计准则委员会 S1 中文介绍", u:"https://www.casc.org.cn/2023/0628/243203.shtml"}]
        },
        {key:"s2", name:"IFRS S2 气候相关披露", abbr:"IFRS S2", org:"国际可持续准则理事会（ISSB）／IFRS 基金会",
         region:"国际通用", g:"国际通用", nature:"自愿（是否强制由各司法辖区决定）", nlv:2,
         scope:"与 IFRS S1 相同口径的主体范围，专门规范气候相关风险与机遇的披露；是各国交易所气候披露新规（含港交所 D 部分、英国 UK SRS S2 等）的主要对标对象。",
         desc:"IFRS S2 与 S1 配套使用，将四支柱应用于气候议题。其最具代表性的强制要求是：按 GHG Protocol 方法披露范围一、范围二、范围三温室气体排放（按吨 CO₂ 当量）；开展气候情景分析以评估气候韧性；披露跨行业指标与行业特定指标；披露气候相关目标及其进展。金融企业（资产管理、商业银行、保险）还须披露融资排放（范围三第 15 类「投资」）。",
         framework:["治理：监督气候相关风险与机遇的治理机构与管理层职责","战略：气候相关风险与机遇、业务模式与价值链影响、转型计划、气候韧性（情景分析）","风险管理：识别、评估、排序与监控气候相关风险与机遇的流程及其融入整体风险管理的程度","指标与目标：跨行业指标、行业特定指标、主体设定或法定要求的目标及其进展"],
         topics:["气候相关物理风险（急性／慢性）与转型风险（政策法律、技术、市场、声誉）","气候相关机遇（资源效率、能源来源、产品与服务、市场、韧性）"],
         metrics:["范围一、范围二（基于市场／基于地点）、范围三温室气体绝对排放量（tCO₂e）","排放强度、内部碳价格、气候相关资本部署金额","易受物理风险／转型风险影响的资产或业务活动金额与百分比","行业特定指标（源自 SASB 77 个行业准则的气候相关内容）"],
         caliber:["排放量按 GHG Protocol 企业核算与报告标准计量，并允许辖区宽免（如采用辖区或交易所要求的 GWP 值）","须披露计量方法、输入数据、假设与范围三类别的选择依据","可比信息、报告时间与财务报表一致；允许相称性与商业敏感豁免"],
         time:["2023 年 6 月 26 日发布；自 2024 年 1 月 1 日或之后开始的年度报告期生效","2025 年 ISSB 就温室气体排放披露修订发布征求意见稿（拟对范围三部分情形提供豁免与简化）"],
         src:[{n:"IFRS S2 准则页面", u:"https://www.ifrs.org/issued-standards/ifrs-sustainability-standards-navigator/"},{n:"IFRS 基金会 ISSB 首页", u:"https://www.ifrs.org/groups/international-sustainability-standards-board/"}]
        },
        {key:"sasb", name:"SASB 可持续会计准则（行业指标）", abbr:"SASB", org:"可持续会计准则委员会（SASB）／现由 IFRS 基金会（ISSB）维护",
         region:"国际通用（按行业划分）", g:"国际通用", nature:"自愿（作为 ISSB 行业指标来源被广泛引用）", nlv:1,
         scope:"按 77 个行业（11 个板块）分别设定「财务上重要」的可持续会计指标，主要服务于投资者对公司间同行业可比信息的需求；现已被整合为 ISSB 的行业披露基础。",
         desc:"SASB 准则的核心理念是「行业特异性 + 财务重要性」：同一议题在不同行业的重要性差异极大，因此每个行业仅规定少数若干最可能影响财务表现的主题与会计指标。SASB 的气候相关内容已被 ISSB 吸收进《IFRS S2 行业披露指南》，成为企业按 IFRS S2 选择行业指标时的默认参考。",
         framework:["11 个板块 → 77 个行业；每个行业准则包含：披露主题、会计指标（量化／定性）、活动度量（便于归一化）、技术协议","维度：环境、社会资本、人力资本、商业模式与创新、领导力与治理"],
         topics:["依行业而异，如互联网媒体与服务行业（TC-IM）关注能源与水资源管理（数据中心）、数据隐私与安全、员工多元与包容、内容治理等"],
         metrics:["TC-IM-130a.1：总能耗、电网电力占比、可再生能源占比（数据中心相关）","TC-IM-130a.3：环境政策讨论","TC-IM-220a.1：数据隐私相关政策与合规事件数","TC-IM-230a.2：因法律程序导致的与用户隐私相关的经济损失金额","TC-IM-330a.3：员工性别与族裔构成百分比"],
         caliber:["重要性口径：财务重要性（面向投资者）","指标须配套「活动度量」（如收入、员工数、装机容量）以便同业对比","通常与 GRI（影响维度）或 ISSB 准则组合使用，而非单独成报告"],
         time:["2018 年发布首版完整准则；2022 年随价值报告基金会（VRF）并入 IFRS 基金会","2025 年 7 月 ISSB 发布两份征求意见稿，拟修订 9 个优先行业（含全部 8 个采掘与矿产加工行业及加工食品业）并对另外 41 个行业的水资源管理、员工健康安全等指标做一致性对齐，征求意见至 2025 年 11 月 30 日"],
         src:[{n:"SASB 标准（IFRS 基金会）", u:"https://sasb.ifrs.org/"},{n:"IFRS 基金会 2025 年 8 月通讯（SASB 修订进展）", u:"https://www.ifrs.org/news-and-events/updates/nss-newsletter/national-standard-setters-newsletter-august-2025"}]
        },
        {key:"tcfd", name:"TCFD 气候相关财务信息披露建议", abbr:"TCFD", org:"金融稳定理事会（FSB）气候相关财务披露工作组",
         region:"国际通用", g:"国际通用", nature:"自愿（其建议已被多辖区监管吸收；TCFD 已于 2023 年解散）", nlv:1,
         scope:"面向所有行业（金融机构与非金融企业）的气候相关财务信息披露框架；发布以来被 G20/FSB 及主要交易所广泛采用为气候披露的共同语言。",
         desc:"TCFD 于 2017 年发布、2021 年补充《指标、目标与转型计划》附录，确立了「治理、战略、风险管理、指标与目标」四大支柱共 11 项建议披露。2023 年 10 月 TCFD 正式解散，其建议的理念与结构已被 IFRS S1/S2 完整吸收，企业气候披露进展的年度监测工作由 IFRS 基金会承接。<br>当前多数新规（港交所 D 部分、英国、日本、新加坡等）均以 TCFD 四支柱 + ISSB 指标的方式落地。",
         framework:["治理（2 项）：董事会对气候风险机遇的监督；管理层在评估与管理中的职责","战略（3 项）：短中长期气候风险与机遇；对业务、战略与财务规划的影响；气候韧性（含 2℃ 或更低情景分析）","风险管理（3 项）：识别与评估流程；管理流程；与整体风险管理的整合","指标与目标（3 项）：用于评估风险机遇的指标；范围一、二、三排放及相关风险；目标与进展"],
         topics:["转型风险：政策与法律、技术、市场、声誉","物理风险：急性（极端天气）与慢性（长期气候格局变化）","气候机遇：资源效率、能源来源、产品与服务、市场、韧性"],

        {key:"csrd", name:"CSRD 与 ESRS（欧盟可持续报告指令与准则）", abbr:"CSRD / ESRS", org:"欧盟委员会／欧洲财务报告咨询组（EFRAG）",
         region:"欧盟（含在欧盟有重要业务的非欧盟企业）", g:"欧盟", nature:"强制（正经「Omnibus 简化」修订，范围与时间表已调整）", nlv:3,
         scope:"适用于欧盟境内大型企业及集团、上市企业及在欧盟净营业额达到一定门槛的非欧盟集团；中小企业可通过 VSME 自愿标准报告。可持续性声明须置于管理层报告内，而非独立的「可持续发展报告」。",
         desc:"CSRD（指令 (EU) 2022/2464）取代原非财务报告指令（NFRD），要求企业按 ESRS 披露「双重重要性」信息：既要披露可持续性议题对企业财务的影响（财务重要性），也要披露企业对环境与社会的影响（影响重要性）。<br>ESRS 由 EFRAG 制定，首批跨行业准则（Set 1）于 2023 年 7 月 31 日通过授权条例 (EU) 2023/2772 生效，框架与 TCFD／ISSB 四支柱相通但议题要求更细。",
         framework:["ESRS 1 一般要求；ESRS 2 一般披露","环境：E1 气候变化、E2 污染、E3 水与海洋资源、E4 生物多样性与生态系统、E5 资源利用与循环经济","社会：S1 自有劳动力、S2 价值链工人、S3 受影响社区、S4 消费者与终端用户","治理：G1 商业行为","行业专属准则与 VSME（中小企业自愿标准）陆续制定中"],
         topics:["覆盖环境五类、社会四类与治理一类完整议题，并须披露欧盟分类法（EU Taxonomy）对齐比例","要求披露可持续尽职调查流程、受影响利益相关方参与、以及重大负面影响的处理"],
         metrics:["ESRS E1-4：温室气体减排目标；E1-5：能耗与能源结构；E1-6：范围一、二、三排放总量与强度","ESRS E1-9：气候相关转型／物理风险的预期财务影响（修订中）","ESRS S1-6~S1-16：员工构成、工作条件、薪酬、健康安全、培训等","ESRS G1：商业行为（反腐败、反竞争、供应商关系、付款惯例）"],
         caliber:["重要性口径：双重重要性（财务重要性 + 影响重要性）","价值链：须覆盖上下游价值链，允许使用估算但须说明方法与不确定性","报告位置：置于管理层报告（management report）内，须接受法定审计或有限保证鉴证"],
         time:["CSRD 于 2023 年 1 月 5 日生效；ESRS Set 1 授权条例 2023 年 7 月 31 日发布","2025 年 4 月「停表」指令 (EU) 2025/794 将第二波、第三波适用推迟两年；2025 年 11 月「快速修正」授权条例 (EU) 2025/1416 扩大过渡豁免","2026 年 2 月 26 日 Omnibus I 修订指令 (EU) 2026/470 刊登于官方公报：强制门槛提高为「净营业额超过 4.5 亿欧元且年平均雇员超过 1,000 人」，取消上市中小企业强制波次；第二波自 2027 财年起适用（2028 年发布），成员国转化截止 2027 年 3 月 19 日；简化版 ESRS 由欧盟委员会推进中"],

        {key:"hkex", name:"香港交易所《环境、社会及管治报告守则》（上市规则附录 C2）", abbr:"HKEX ESG Code", org:"香港交易及结算所有限公司（HKEX）",
         region:"中国香港（主板与 GEM 上市发行人）", g:"中国香港", nature:"强制 + 不遵守就解释", nlv:3,
         scope:"适用于所有在香港联交所主板与 GEM 上市的发行人；原《ESG 报告指引》自 2016 年起对部分指标采取「不遵守就解释」，2020 年 7 月 1 日修订版将多项指标提升为强制。2025 年 1 月 1 日起新增 D 部分气候相关披露。",
         desc:"联交所 2024 年 4 月 19 日刊发咨询总结，将《ESG 报告指引》更名为《环境、社会及管治报告守则》，并新增 D 部分（Part D）系统规定气候相关披露，整体紧贴 IFRS S2。<br>守则分为：A 部分（引言与汇报原则）、B 部分（强制披露：管治架构、汇报原则与范围）、C 部分（环境与社会 KPI：A1 排放物、A2 资源使用、A3 环境及天然资源、B1 雇佣、B2 健康与安全、B3 发展及培训、B4 劳工准则、B5 供应链管理、B6 产品责任、B7 反贪污、B8 社区投资）、D 部分（气候相关披露）。",
         framework:["A 部分：引言（含「不遵守就解释」与重要性、量化、平衡、一致性四项汇报原则）","B 部分：管治架构（董事会声明、ESG 管治）与汇报范围","C 部分：环境 KPI（A1 排放物、A2 资源使用、A3 环境与天然资源）与社会 KPI（B1—B8 共八个层面）","D 部分：气候相关披露（管治、策略〔含转型计划与气候韧性〕、风险管理、指标及目标）"],
         topics:["环境：废气与温室气体排放、废弃物、能源与水资源使用效率、减废与减排目标、气候相关风险与机遇","社会：雇佣与劳工准则、职业健康安全、发展与培训、供应链管理、产品责任（含数据隐私与知识产权）、反贪污、社区投资"],
         metrics:["范围一、范围二温室气体排放（2025 财年起对全体主板与 GEM 发行人强制）；范围三排放（D 部分新增）","A1.1 排放物种类及排放量；A1.2 温室气体总排放量及强度；A1.5 减排目标；A2.1 能源消耗量及强度；A2.2 用水量；A2.3 能源使用效益目标；A2.4 用水效益目标","A1.3 有害废弃物、A1.4 无害废弃物产生量及密度","B1.1 员工总数与构成；B2.1 因工死亡与工伤；B3.1 受训员工百分比与平均时数；B7.1 贪污诉讼案件数"],
         caliber:["汇报原则：重要性、量化、平衡、一致性；发行人也须说明报告范围与边界","气候相关披露按发行人规模分阶段实施，并设有「合理资料宽免」「能力宽免」「商业敏感宽免」「财务影响宽免」四项实施宽免","按 ISSB 准则编制的报告被视为符合 D 部分；发行人须以对照表形式指明守则要求的落点"],
         time:["修订后《上市规则》自 2025 年 1 月 1 日起生效","范围一、二排放：所有主板与 GEM 发行人自 2025 年 1 月 1 日或之后开始的财政年度起强制披露","其他气候披露：主板发行人按「不遵守就解释」自 2025 财年起适用；大型股发行人（恒生综合大型股指数成分股）自 2026 年 1 月 1 日或之后开始的财政年度起强制披露；GEM 发行人鼓励自愿披露"],
         src:[{n:"港交所：ESG 报告守则（附录 C2）", u:"https://www.hkex.com.hk/Listing/Rules-and-Guidance/Environmental-Social-and-Governance?sc_lang=zh-HK"},{n:"港交所 2024-04-19 咨询总结（气候信息披露）", u:"https://www.hkex.com.hk/News/Regulatory-Announcements/2024/240419news?sc_lang=zh-HK"}]

        {key:"cn", name:"沪深北交易所《上市公司可持续发展报告指引》及《编制指南》", abbr:"沪深北指引", org:"上海证券交易所／深圳证券交易所／北京证券交易所（中国证监会指导）",
         region:"中国内地（上市公司）", g:"中国内地", nature:"强制 + 自愿 + 不披露须解释", nlv:3,
         scope:"适用于沪深北三所上市公司；其中「报告期内持续被纳入上证 180、科创 50、深证 100、创业板指数样本公司」以及「境内外同时上市公司」为首批强制披露主体，其余公司自愿披露。",
         desc:"三所指引同日发布、同步实施，采用「强制披露 + 自愿披露 + 不披露须解释」的组合安排，整体框架为「总则—可持续发展治理—战略—影响、风险和机遇管理—指标与目标」，与国际主流准则（ISSB、GRI）结构相通。2025 年 1 月三所进一步发布《上市公司可持续发展报告编制指南》，并明确强制披露主体应当在 2026 年 4 月 30 日前发布 2025 年度可持续发展报告。",
         framework:["总则：披露原则、报告范围与边界、重要性与「不披露须解释」安排","可持续发展治理：董事会与治理架构、商业行为（反不正当竞争、反贪污等）","战略：可持续发展相关影响、风险和机遇的识别、评估与应对","影响、风险和机遇管理：管理流程与融入公司治理的程度","指标与目标：环境（应对气候变化、污染物排放、废弃物、生态系统与生物多样性、资源利用、循环经济）、社会（乡村振兴、社会贡献、创新驱动、科技伦理、供应商与客户、员工）、治理（可持续发展治理、利益相关方沟通）"],
         topics:["环境维度：应对气候变化（含温室气体排放核算与减排）、污染物与废弃物处理、生态系统与生物多样性保护、能源与水资源利用、循环经济","社会维度：乡村振兴与社会贡献、创新驱动与科技伦理、供应链安全与平等对待中小企业、产品与服务质量安全、数据安全与客户隐私保护、员工权益与发展","治理与可持续发展相关信息：治理架构、合规与风险管理、尽职调查、利益相关方沟通"],
         metrics:["温室气体排放量（范围一、范围二，鼓励披露范围三）及排放强度、减排措施与成效","能源与水资源消耗量及强度；污染物排放种类与数量；废弃物产生量与处置方式","员工构成、培训、职业健康安全等社会指标","量化目标及其年度进展，鼓励第三方鉴证"],
         caliber:["采用「双重重要性」思路：既考虑议题对公司财务的影响，也考虑公司对环境社会的影响","披露口径与统计边界须明确；鼓励引用国家及行业标准（如 GB/T 32150 系列温室气体核算方法，衔接模块 02）","不适用的议题按「不披露须解释」处理，须说明原因"],
         time:["2024 年 4 月 12 日发布，自 2024 年 5 月 1 日起实施","2025 年 1 月发布《上市公司可持续发展报告编制指南》","强制披露主体最迟应于 2026 年 4 月 30 日前发布 2025 年度可持续发展报告"],
         src:[{n:"上海证券交易所：自律监管指引第 14 号", u:"https://www.sse.com.cn/lawandrules/sserules/main/listing/stocks/c/c_20190830_3641210.shtml"},{n:"深圳证券交易所：自律监管指引第 17 号", u:"https://www.szse.cn/lawrules/rule/listed/stock/"},{n:"北京证券交易所：持续监管指引第 11 号", u:"https://www.bse.cn/law_rules.html"}]

        {key:"mof", name:"《企业可持续披露准则——基本准则（试行）》与《第 1 号——气候（试行）（征求意见稿）》", abbr:"财政部准则", org:"中华人民共和国财政部（气候准则由财政部与生态环境部联合发布）／财政部会同其他八部门",
         region:"中国内地（各类企业）", g:"中国内地", nature:"现阶段自愿实施（未来将逐步扩大至强制）", nlv:1,
         scope:"基本准则适用于在中国境内设立的企业（含公司）；拟由上市公司起步，逐步扩展至非上市公司、由大型企业扩展至中小企业、由定性要求扩展至定量要求、由自愿披露扩展至强制披露。",
         desc:"基本准则是国家统一可持续披露准则体系的顶层设计，统驭具体准则与应用指南的制定，明确披露目标、信息质量特征、披露要素与框架。气候准则是首部具体（议题）准则，共六章 47 条，围绕治理、战略、风险和机遇管理、指标与目标四要素构建，与 IFRS S2 高度趋同，同时体现中国特色：要求企业依据中国相关部门制定的碳排放核算标准披露温室气体数据（而非直接采用 GHG Protocol），并要求就碳排放权交易、绿电绿证采购与碳信用的财务影响作定量披露。",
         framework:["基本准则：披露目标与原则、信息质量特征（可靠性、相关性、可比性、可验证性、可理解性、及时性）、披露要素（治理、战略、风险和机遇管理、指标与目标）、披露要求与豁免","气候准则（征求意见稿）六章：总则 4 条、治理 5 条、战略 11 条、风险和机遇管理 5 条、指标和目标 21 条、附则 1 条，另附术语定义"],
         topics:["基本准则：覆盖环境、社会与治理全部可持续议题","气候准则：气候相关风险与机遇、气候韧性、转型与减排措施、碳交易与碳信用安排、融资排放（金融机构）"],
         metrics:["按范围一、范围二、范围三分类披露温室气体排放；范围三涉及上下游 15 类活动","气候相关行业通用指标与行业特定指标；气候相关目标及进展","金融机构（资产管理、商业银行、保险）须按范围三第 15 类「投资」披露融资排放","涉及碳交易、绿电绿证与碳信用的，须披露相关财务影响"],
         caliber:["主要使用者为投资者与债权人，兼顾政府与利益相关方；不要求以影响信息遮蔽财务重要信息","相称性原则：允许企业采用与其技能、能力和资源相称的方法，使用「无须付出过度成本或努力即可获得」的信息","温室气体排放核算依据中国相关部门制定的核算标准（衔接模块 02 的 GB/T 32150 系列与企业 MRV 体系）"],
         time:["2024 年 11 月 20 日基本准则（试行）由财政部等九部门联合印发；在实施范围及实施要求作出规定之前由企业自愿实施","2025 年 4 月 30 日发布《第 1 号——气候（试行）（征求意见稿）》（财办会〔2025〕17 号），意见反馈截止 2025 年 5 月 31 日","财政部计划到 2027 年前出台基本准则与气候准则，到 2030 年前基本建成国家统一的可持续披露准则体系；同步为电力、钢铁、煤炭、石油、化肥、铝、氢、水泥、汽车等 9 个行业编制应用指南"],
         src:[{n:"财政部：气候准则征求意见（财办会〔2025〕17 号）", u:"https://kjs.mof.gov.cn/gongzuotongzhi/202504/t20250429_3962990.htm"},{n:"IFRS 基金会：中国辖区概览（英文）", u:"https://www.ifrs.org/content/dam/ifrs/publications/sustainability-jurisdictions/pdf-snapshots/china-ifrs-snapshot.pdf"}]
        },
        {key:"tnfd", name:"TNFD 自然相关财务披露建议", abbr:"TNFD", org:"自然相关财务披露工作组（TNFD），由联合国开发计划署等支持设立",

        {t:"目标设定具备外部背书", d:"2030 年自身运营及供应链碳中和、范围一和二较 2021 年绝对减排 70%、范围三减排 30%、2030 年 100% 绿色电力，以及 2050 年净零目标，均已通过 SBTi 验证并符合《巴黎协定》1.5℃ 路径。"},
        {t:"重要性评估方法论透明", d:"由第三方专业顾问开展，回收超过 6,000 份有效问卷（覆盖用户、业务伙伴、员工、监管机构、供应商、学者、媒体与非营利组织），并与董事、管理层及投资者开展访谈，形成 30 项议题的重要性矩阵（环境 7 项、社会 14 项、管治 9 项）。"},
        {t:"E/S/G 三维均有量化 KPI 且三年可比", d:"附录 ESG 关键绩效表提供 2022—2024 三年对比，并逐项标注计量标准、方法、假设与转换因子来源，符合港交所守则的「量化」与「一致性」原则。"}
      ],
      gaps:[
        {t:"范围三覆盖不完整", d:"2024 年披露了 GHG Protocol 15 类中的 9 类（2023 年为 0 类，已有明显改善），下游类别（如售出产品的使用、特许经营、投资等）基本空白。而范围三已占总排放的 50.71%，其中「上游租赁资产」（1,622,258.23 tCO₂e）单项即占范围三的 52.82%，是最大排放来源却主要依赖租赁数据中心的绿电转型（当前仅 3.8%）来化解，抓手有限。<br>IFRS S2 与港交所 D 部分对范围三完整性的要求更高。"},
        {t:"气候相关财务影响的量化披露不足", d:"报告披露了气候风险识别与情景分析的流程（含低碳与高碳情景、短中长期时间范围、行业与资产层面情景分析），但未见到气候相关风险与机遇对财务状况、财务业绩与现金流量的定量影响（金额或占比）。港交所 D 部分第 25 段对此有要求，但提供了「能力宽免」与「财务影响宽免」，大型股发行人自 2026 财年起强制适用后需补齐。"},
        {t:"减排路径与目标之间仍有差距", d:"温室气体排放总量较基准年（2021）仍上升 3.1%，强度下降 12.4%；可再生电力占比 22.0%，距「2030 年 100% 绿电」目标缺口较大。绝对减排目标要求范围一、二在 2030 年前较 2021 年下降 70%，后续压力集中在绿电采购与数据中心能效两端。"},
        {t:"供应链数据颗粒度不足", d:"《腾讯供应商 ESG 行为准则》的签署率、供应商审核覆盖率、供应商实际排放数据等关键过程指标未披露；租赁数据中心绿电占比虽由 0% 提升至 3.8%，但绝对水平偏低。GRI 308 与 ESRS S2（价值链工人）对供应商层面信息的要求更为具体。"},
        {t:"水资源与生物多样性的指标深度偏弱", d:"用水仅披露取水总量与强度，未见排水量、耗水量及高水压力流域的敞口分布（GRI 303-3/303-4/303-5 与 ESRS E3 要求更细）；生物多样性以项目与案例描述为主，缺乏 TNFD 所要求的优先地点（priority locations）、受影响面积等空间化指标。"},
        {t:"GRI 与 IFRS 的符合性声明不够完整", d:"报告明确「按港交所 ESG 守则编制、参照 IFRS S1/2 与 GRI、SASB」，但附录报告索引的对照表所列框架为港交所 ESG 守则、TCFD、SASB、SDGs 与 UNGC，未单列 GRI 逐条内容索引；对 GRI 的引用为「参照」而非「按 GRI 标准编制」的合规声明，外部使用者难以逐条核验其 GRI 覆盖度。"},
        {t:"员工数据口径需留意", d:"ESG 报告采用「集团本部」口径（58,350 人），业绩公告与年报采用含子公司与并表投资公司的口径（110,558 人），两者相差近一倍。跨报告引用时必须注明口径，否则容易误读（该差异已在报告附注中说明）。"}
      ],
      sources:[
        {n:"腾讯控股《2024 年环境、社会及管治报告》全文（港交所披露易，2025-04-08）", u:"https://www.hkexnews.hk/listedco/listconews/sehk/2025/0408/2025040800680_c.pdf"},
        {n:"香港交易所：ESG 报告守则（上市规则附录 C2）", u:"https://www.hkex.com.hk/Listing/Rules-and-Guidance/Environmental-Social-and-Governance?sc_lang=zh-HK"},
        {n:"港交所 2024-04-19 咨询总结（气候信息披露新规）", u:"https://www.hkex.com.hk/News/Regulatory-Announcements/2024/240419news?sc_lang=zh-HK"},
        {n:"IFRS 基金会：IFRS S1 / S2 准则页", u:"https://www.ifrs.org/issued-standards/ifrs-sustainability-standards-navigator/"},
        {n:"GRI 标准官方页面", u:"https://www.globalreporting.org/standards/"},
        {n:"SASB 标准（IFRS 基金会）", u:"https://sasb.ifrs.org/"}
      ]},
      tools:[],
      flow:{
        intro:"以下为上市公司编制并披露《可持续发展报告》（ESG 报告）的典型工作流，按「治理—议题—数据—编制—验证—披露」六步展开。不同板块（主板/创业板/科创板/北交所）在强制与自愿议题范围上有差异，实操中须以所属交易所最新指引为准。",
        steps:[
          {t:"第一步 · 建立可持续（ESG）治理架构", who:"董事会 / ESG 委员会 / 董秘办",
           d:"明确董事会对可持续发展事宜的监督责任，设立或指定 ESG 工作委员会/工作小组，落实牵头部门与责任人，将可持续发展理念纳入公司战略与经营管理活动。这是指引框架中「治理」环节的落地要求。",
           out:"《ESG 治理架构文件》、职责分工表、董事会决议"},
          {t:"第二步 · 开展双重重要性议题识别", who:"ESG 工作小组 + 各业务部门",
           d:"从「财务重要性」与「影响重要性」两个维度识别议题：财务重要性指可持续发展议题对公司财务的影响；影响重要性指公司经营活动对社会、环境的影响。通过利益相关方调研、行业对标形成议题清单并排序。",
           out:"议题清单与重要性矩阵、利益相关方沟通记录"},
          {t:"第三步 · 搭建数据收集与核算体系", who:"财务 / 生产 / EHS / 能源管理部门",
           d:"按议题确定指标口径与统计边界，建立跨部门数据报送机制。环境维度中温室气体排放数据须按 GB/T 32150、ISO 14064-1 或 GHG Protocol 核算范围一、范围二排放，并逐步扩展范围三（衔接模块 02）。",
           out:"《ESG 指标数据字典》、排放量核算表（范围一/二/三）、数据责任人清单"},
          {t:"第四步 · 按指引框架编制报告", who:"董秘办 / ESG 工作小组",
           d:"按「总则—可持续发展治理—战略—影响、风险和机遇管理—指标与目标」的框架组织内容，逐项回应指引要求议题；对不适用的议题按「不披露须解释」原则说明理由。",
           out:"《可持续发展报告》初稿"},
          {t:"第五步 · 内部审核与第三方鉴证", who:"内控 / 审计 / 第三方机构",
           d:"完成内部交叉复核与数据溯源检查；鼓励聘请第三方机构对报告或关键数据（尤其是温室气体排放数据）进行独立鉴证，提升数据可信度。鉴证依据通常参照 ISAE 3000 或 ISO 14064-3。",
           out:"内部审核记录、第三方鉴证声明（如适用）"},
          {t:"第六步 · 审议披露与持续改进", who:"董事会 / 董秘办",
           d:"报告经董事会审议通过后与年报同步或按指引要求时限披露；披露后跟踪监管反馈与评级结果（如国际 ESG 评级、ISSB 趋同要求），形成下一年度改进计划。",
           out:"董事会决议、披露公告、下年度改进清单"}
        ]
      },
      quiz:[
        {id:"m05q1", type:"choice", q:"三大交易所《上市公司可持续发展报告指引（试行）》自何时起实施？", options:["2023年10月1日","2024年5月1日","2025年1月1日","2026年1月1日"], answer:1, explain:"上交所第 14 号、深交所第 17 号、北交所第 11 号指引均自 2024 年 5 月 1 日起实施。"},
        {id:"m05q2", type:"choice", q:"北京证券交易所可持续发展报告指引的编号是？", options:["第 11 号","第 14 号","第 17 号","第 21 号"], answer:0, explain:"北交所为《上市公司持续监管指引第 11 号——可持续发展报告（试行）》，2025 年 4 月 25 日第一次修订。"},
        {id:"m05q3", type:"choice", q:"深圳证券交易所可持续发展报告指引的编号是？", options:["第 11 号","第 14 号","第 17 号","第 20 号"], answer:2, explain:"深交所为《自律监管指引第 17 号——可持续发展报告（试行）》，适用于主板、创业板上市公司。"},
        {id:"m05q4", type:"judge", q:"上交所《可持续发展报告指引》的编号为自律监管指引第 14 号。", options:["正确","错误"], answer:0, explain:"上交所为《上市公司自律监管指引第 14 号——可持续发展报告（试行）》。"},
        {id:"m05q5", type:"judge", q:"ISSB 发布的 IFRS S2 是气候相关可持续信息披露准则。", options:["正确","错误"], answer:0, explain:"IFRS S2《气候相关披露》要求企业披露气候风险、机遇与温室气体排放等信息。"},
        {id:"m05q6", type:"choice", q:"联合国《2030 年可持续发展议程》共确立多少项可持续发展目标（SDGs）？", options:["8 项","12 项","17 项","21 项"], answer:2, explain:"联合国确立了 17 项可持续发展目标（THE 17 GOALS），涵盖消除贫困、气候行动等维度。"},
        {id:"m05q7", type:"choice", q:"GRI Standards 2021 版自何时起强制替代旧版？", options:["2021年10月1日","2022年1月1日","2023年1月1日及之后开始的报告期","2024年1月1日"], answer:2, explain:"GRI 于 2021 年 10 月发布 2021 版标准体系（GRI 1/2/3），自 2023 年 1 月 1 日及之后开始的报告期起强制替代 2016/2018 版。"},
        {id:"m05q8", type:"choice", q:"IFRS S1 与 IFRS S2 的生效日期是？", options:["2023年6月26日","2024年1月1日或之后开始的年度报告期","2025年1月1日","2027年1月1日"], answer:1, explain:"ISSB 于 2023 年 6 月 26 日发布两份准则，自 2024 年 1 月 1 日或之后开始的年度报告期生效，允许提前采用（提前采用须同时采用 S1 与 S2）。"},
        {id:"m05q9", type:"choice", q:"香港交易所《ESG 报告守则》新增的气候相关披露（D 部分）自何时起生效？", options:["2024年5月1日","2025年1月1日","2026年1月1日","2027年1月1日"], answer:1, explain:"联交所 2024 年 4 月 19 日刊发咨询总结，D 部分气候规定自 2025 年 1 月 1 日起生效并分阶段实施：所有主板及 GEM 发行人须强制披露范围 1、2 排放；大型股发行人自 2026 年 1 月 1 日或之后开始的财政年度起全面强制披露。"},
        {id:"m05q10", type:"choice", q:"按沪深北交易所安排，强制披露主体最迟应于何时发布 2025 年度可持续发展报告？", options:["2025年4月30日","2026年4月30日","2026年12月31日","2027年4月30日"], answer:1, explain:"2025 年 1 月发布的《上市公司可持续发展报告编制指南》明确：强制披露主体应当在 2026 年 4 月 30 日前发布 2025 年度可持续发展报告。"},
        {id:"m05q11", type:"choice", q:"《企业可持续披露准则——基本准则（试行）》目前的属性是？", options:["全部企业强制实施","上市公司强制实施","在实施范围及实施要求作出规定之前由企业自愿实施","仅央企实施"], answer:2, explain:"财政部等九部门 2024 年 11 月 20 日印发基本准则，在实施范围及实施要求作出规定之前由企业自愿实施；财政部计划到 2027 年前出台基本准则与气候准则，到 2030 年前基本建成国家统一的可持续披露准则体系。"},
        {id:"m05q12", type:"judge", q:"欧盟 ESRS 采用「双重重要性」，而 ISSB 准则以「财务重要性」为主。", options:["正确","错误"], answer:0, explain:"ESRS 要求同时披露可持续性议题对企业财务的影响与企业对环境社会的影响（双重重要性）；ISSB（IFRS S1/S2）主要服务于投资者与债权人，以财务重要性为主线。"},
        {id:"m05q13", type:"judge", q:"TCFD 已于 2023 年解散，其气候相关披露进展的监测工作由 IFRS 基金会承接。", options:["正确","错误"], answer:0, explain:"TCFD 于 2023 年 10 月解散，其建议已基本被 IFRS S1/S2 吸收；IFRS 基金会自 2024 年起承接企业气候披露进展的监测与年度进展报告。"},
        {id:"m05q14", type:"choice", q:"腾讯 2024 年 ESG 报告中，范围三排放占温室气体排放总量的比例约为？", options:["约 2%","约 20%","约 50.7%","约 85%"], answer:2, explain:"报告披露范围一 121,466.0 吨、范围二 2,863,848.7 吨（基于市场）、范围三 3,071,295.4 吨，范围三占比约 50.71%，其中「上游租赁资产」单项即占范围三的 52.82%。"}

    { id:"m07", no:"07", name:"国际碳机制与 CBAM", icon:"🌍",
      desc:"欧盟 CBAM、国际碳市场机制与合规应对 ｜ 对应知识库「07 国际碳机制与CBAM」：4 项资料 · 2 个专题夹（CBAM 33 项 / FSC 1 项）· 9/7 更新",
      knowledge:[
        {t:"CBAM 时间表与法规体系",
         x:"欧盟碳边境调节机制（Carbon Border Adjustment Mechanism, CBAM）于 2026 年 1 月 1 日起正式实施（此前设有过渡申报期，先行申报不缴费）。知识库收录欧盟税收与海关同盟（Taxation and Customs Union）「CBAM legislation and guidance」官方法规与指引页面，以及「CBAM」专题夹 33 项资料。"},
        {t:"默认值争议与中方立场（商务部答记者问）",
         x:"针对 2026 年正式实施前欧盟密集发布的 CBAM 立法提案与实施细则（包括设定碳排放强度默认值、计划扩大产品覆盖范围），商务部指出：欧方对中国产品碳排放强度设定显著偏高的基础默认值，并将在未来三年内逐年提高，不符合中国当前实际水平和未来发展趋势，对中方构成不公平、歧视性待遇，涉嫌违反世贸组织规则；中方对此表示关切。"},
        {t:"国际碳市场机制全景",
         x:"欧盟、中国、日韩等均已建立碳市场体系并加速构建全球碳交易网络。主要机制包括：欧盟碳市场（EU ETS）、国际自愿减排机制、区域性碳市场，以及《巴黎协定》第六条国际合作协议机制。"},
        {t:"FSC 专题（知识库子夹 · 1 项资料）",
         x:"FSC（森林管理委员会）认证与森林可持续经营、林产品供应链溯源相关，与林业碳汇项目的可持续管理存在关联。具体内容：待补充。"}
      ],
      cases:[
        {t:"案例 · 出口企业 CBAM 合规应对",
         x:"2026 年起出口欧盟相关产品需申报并缴纳「碳关税」：企业应尽早建立产品碳足迹核算能力（衔接模块 02），用实际排放数据替代偏高的默认值，并通过绿电采购、节能技改降低产品隐含碳排放强度，以降低 CBAM 成本。"}
      ],
      tools:[],
      flow:{
        intro:"欧盟 CBAM 自 2026 年 1 月 1 日起正式实施，进入产生财务义务的阶段。出口企业（钢铁、铝、水泥、化肥、电力、氢等覆盖产品）的典型合规流程如下；核心目标是用实际核算数据替代显著偏高的默认值，从而降低碳成本。",
        steps:[
          {t:"第一步 · 判定适用范围与角色", who:"外贸 / 合规部门",
           d:"核对出口产品是否属于 CBAM 覆盖产品清单（按 CN 编码判定），并明确企业角色：欧盟进口商为「申报人」，中国出口企业通常作为数据提供方配合。同时确认对应产品的直接排放边界（部分产品还需计入间接排放/电力）。",
           out:"适用产品清单与 CN 编码对照表、申报人确认函"},
          {t:"第二步 · 建立产品碳足迹（隐含碳）核算能力", who:"生产技术 / 能源 / 碳管理部门",
           d:"按欧盟实施细则规定的核算方法，计算单位产品的直接（及适用时的间接）温室气体排放。企业可优先采用经认可的核算体系数据（衔接模块 02 的 GB/T 32150/32151、ISO 14064、ISO 14067 等方法），建立从工序到产品的排放分配逻辑与前体物料（precursor）追溯。",
           out:"《产品隐含碳排放核算说明》、单位产品排放强度（tCO₂e/t）台账"},
          {t:"第三步 · 数据质量保证与内部核查", who:"质量 / EHS / 内控",

          {t:"第四步 · 向欧盟进口商提供排放数据", who:"外贸 / 碳管理部门",

      quiz:[

        {id:"m07q2", type:"choice", q:"欧盟 CBAM 自何时起正式实施（开始财务义务）？", options:["2023年10月1日","2024年5月1日","2026年1月1日","2030年1月1日"], answer:2, explain:"欧盟 CBAM 于 2026 年 1 月 1 日起正式实施，此前设有过渡申报期。"},
        {id:"m07q3", type:"judge", q:"商务部指出，欧盟对中国产品碳排放强度设定的基础默认值显著偏高，并将在未来三年内逐年提高。", options:["正确","错误"], answer:0, explain:"商务部在就 CBAM 相关立法提案与实施细则答记者问中指出：默认值显著偏高且逐年提高，不符合中国实际水平，构成不公平、歧视性待遇。"},

    /* ============ 08 零碳园区 ============ */
    { id:"m08", no:"08", name:"零碳园区", icon:"🏞️",
      desc:"国家级零碳园区建设政策与园区低碳场景 ｜ 对应知识库「08 零碳园区」：1 项资料 · 8/19 更新",
      knowledge:[
        {t:"《国家级零碳园区建设名单（第一批）》",
         x:"国家发展改革委办公厅、工业和信息化部办公厅、国家能源局综合司联合印发《关于印发〈国家级零碳园区建设名单（第一批）〉的通知》（发改办环资〔2025〕1082号），发布时间 2025 年 12 月 26 日，来源：环资司。第一批国家级零碳园区建设名单的具体园区清单：待补充。"},
        {t:"零碳园区建设的主要方向",

        {t:"园区的角色：重点排放单元与减排主战场",
         x:"园区集聚工业企业和能源设施，是能源消耗与碳排放的集中区域。园区尺度的减排组合（绿电替代、能效提升、工艺改造、末端治理与碳管理）正是行业减排路径（见模块 02、04）在空间维度的落地形态。"}

      cases:[

      ],
      tools:[ {type:"life", label:"🌱 园区低碳场景抉择"} ],
      flow:{
        intro:"零碳园区建设遵循「摸清家底—编制方案—实施建设—监测核算—评估改进—申报认定」的闭环流程。下列流程综合国家级零碳园区建设名单申报的通行做法；具体指标体系与申报材料要求需以主管部门最新通知为准（完整指标体系：待补充）。",
        steps:[
          {t:"第一步 · 碳家底排查与排放清单编制", who:"园区管委会 + 第三方咨询机构",
           d:"确定园区核算边界（地理边界 + 纳入企业/设施清单），编制园区温室气体排放清单：范围一（园区内燃料燃烧、工业过程、园区车辆等）、范围二（外购电力热力）、重点范围三（入园物流、废弃物处理等）。按 GB/T 32150 等标准核算（衔接模块 02），形成分企业、分行业、分能源品种的排放台账。",
           out:"《园区温室气体排放清单》、排放台账（分企业/分品种）、基准年确定说明"},
          {t:"第二步 · 目标设定与路径方案编制", who:"园区管委会 + 规划设计单位",
           d:"基于排放清单识别主要排放源，设定达峰与中和目标年，并按「减、替、吸、封、管」五条主线组合措施：能效提升与循环化改造、绿电直供与分布式光伏、工业余热利用、绿色建筑与交通电动化、能碳管理平台等，进行减排量测算与投资估算。",
           out:"《零碳园区建设实施方案》、减排路径图、投资与减排量测算表"},
          {t:"第三步 · 建设实施与重点工程落地", who:"园区开发主体 + 入园企业 + 能源服务商",
           d:"按方案推进重点工程：分布式光伏/分散式风电及配套储能、绿电直供专线、园区级能碳管理平台、余热余压利用、充电桩与绿色物流、建筑节能与 BIPV 改造、循环化改造与产业链耦合。同步建立入园项目碳排放准入评价。",
           out:"工程项目台账、能源管理系统上线记录、绿电交易/直供合同"},
          {t:"第四步 · 能碳监测与数据管理", who:"园区运营方",
           d:"建设园区能碳管理平台，对重点用能单位实施在线监测，实现能耗与碳排放数据的自动采集、核算与分析；建立月度/季度数据报送与异常预警机制，保证数据可追溯、可核查（MRV）。",
           out:"能碳管理平台数据看板、监测点位清单、数据质量管理制度"},
          {t:"第五步 · 核算核证与绩效评估", who:"第三方核查机构",
           d:"按年度开展园区碳排放核算与减排成效评估，必要时引入第三方核查/核证；对未完成目标的子项分析原因并调整措施。剩余排放可通过绿电绿证、CCER（模块 03）等机制抵销。",
           out:"年度碳排放报告、核查/核证声明、绩效评估报告"},
          {t:"第六步 · 申报认定与持续改进", who:"园区管委会",
           d:"对照国家级/省级零碳园区申报要求准备材料并按程序申报（如《国家级零碳园区建设名单》由发改、工信、能源三部门联合组织）；入选后按要求定期报送建设进展，形成年度改进清单。",
           out:"申报书与佐证材料、建设进展季报/年报、持续改进计划"}
        ]
      },
      quiz:[
        {id:"m08q1", type:"choice", q:"《国家级零碳园区建设名单（第一批）》由哪些部门联合印发？", options:["国家发改委办公厅、工信部办公厅、国家能源局综合司","生态环境部、住建部","国务院办公厅","商务部、海关总署"], answer:0, explain:"由发改委办公厅、工信部办公厅、国家能源局综合司三部门联合印发（发改办环资〔2025〕1082号）。"},

        {id:"m08q3", type:"judge", q:"BIPV（光伏建筑一体化）可帮助园区建筑实现自发自用、降低运行碳排放。", options:["正确","错误"], answer:0, explain:"BIPV 将光伏发电与建筑结合，就地发电就地消纳，是园区建筑减碳的重要手段。"},
        {id:"m08q4", type:"choice", q:"建筑运行阶段碳排放主要来自？", options:["建材生产运输","采暖、空调、照明与设备用能","施工人员通勤","土地购置成本"], answer:1, explain:"运行碳排放指使用阶段的采暖、制冷、照明、设备用能排放；建材属于隐含碳（另有核算口径）。"},
        {id:"m08q5", type:"judge", q:"推广电动汽车主要体现「终端用能电气化」的减排思路。", options:["正确","错误"], answer:0, explain:"电动汽车把交通终端用能由油品转为电力，配合清洁电力可系统性降低交通碳排放，也适用于园区通勤与物流场景。"},
        {id:"m08q6", type:"judge", q:"园区通过绿电直供可以系统性降低范围二排放。", options:["正确","错误"], answer:0, explain:"范围二排放来自外购电力；绿电直供与绿电采购可降低电网因子对应的间接排放。"}

    /* ============ 板块三：能源绿色低碳转型 ============ */
    { id:"s3", no:"3", name:"能源绿色低碳转型", icon:"⚡",
      desc:"新能源开发、新型储能、新型电力系统与氢能全产业链 —— 能源生产与消费革命的主战场",
      knowledge:[
        {t:"一、新能源开发（风、光、生物质、地热）",
         x:"风电与光伏是能源替代的主力。截至 2024 年底，全国风电、光伏发电合计装机约 14.1 亿千瓦，历史性超过煤电装机，成为第一大电源（国家能源局数据）。开发布局坚持「集中式与分布式并举」：在沙漠、戈壁、荒漠地区规划建设大型风电光伏基地；在中东部推进整县屋顶分布式光伏。生物质能包括农林废弃物直燃/耦合发电、垃圾焚烧发电与生物天然气；地热能分为浅层地源热泵供暖与中深层水热地热利用，属稳定可调的可再生能源。<br>考核要点：新能源装机与发电量占比、消纳率（利用率）是观察能源转型的两个核心指标。"},
        {t:"二、新型储能技术应用（锂电、液流、氢储能）",
         x:"新型储能指除抽水蓄能外、以输出电力为主要形式的储能。截至 2024 年底全国新型储能装机约 7376 万千瓦（国家能源局）。技术路线上：锂离子电池占绝对主导（约 95% 以上），适合 1—4 小时短时储能；全钒液流电池本征安全、循环寿命长，面向 4 小时以上长时储能；压缩空气、飞轮、氢储能各有所长——氢储能可实现跨天、跨季节储能。商业模式上，国家已建立独立储能容量电价机制，共享储能、现货市场套利与辅助服务补偿构成收益来源。<br>观察指标：储能装机规模、平均储能时长、利用率。"},
        {t:"三、新型电力系统建设（源网荷储一体化）",
         x:"构建以新能源为主体的新型电力系统，是实现双碳目标最关键的源头性工程。核心特征是「清洁低碳、安全充裕、经济高效、供需协同、灵活智能」。实施路径包括：<br>① 源网荷储一体化与多能互补——电源侧配储能、电网侧调峰、负荷侧响应、储能侧共享；<br>② 虚拟电厂——通过数字化平台聚合分布式电源、可调负荷与储能，作为整体参与电力市场；<br>③ 需求响应——引导用户错峰用电获得补偿；<br>④ 特高压跨区输电解决风光资源与负荷中心逆向分布问题；<br>⑤ 电力现货市场与绿电绿证交易衔接，让灵活性成为可以定价的商品。"},
        {t:"四、氢能全产业链（制、储、运、加、用）",
         x:"《氢能产业发展中长期规划（2021—2035 年）》明确：氢能是未来国家能源体系的重要组成部分，是用能终端实现绿色低碳转型的重要载体。按排放分灰氢（化石能源制取）、蓝氢（化石能源+CCS）、绿氢（可再生能源电解水）。<br>产业链五环节：制——碱性电解槽与 PEM 电解水制氢为绿氢主流路线；储运——高压气态（20/30MPa）为主，液氢（-253℃）、纯氢/掺氢管道、固态与有机液体储氢（LOHC）在发展；<br>加——加氢站网络建设；用——合成绿氨绿醇等化工原料、钢铁氢冶金替代焦炭、燃料电池汽车与分布式发电掺烧。绿氢成本下降（电价+电解槽效率）是产业拐点的核心变量。"}
      ],
      terms:[
        {t:"绿氢", d:"以可再生电力电解水制取的氢气，全程近零碳排放。与灰氢（化石能源制取）相对，是工业深度脱碳与长时储能的关键载体。"},
        {t:"虚拟电厂（VPP）", d:"不新建实体电厂，通过数字化平台把分散的分布式电源、储能与可调负荷聚合起来，作为一个整体参与电网调度与电力交易。"},
        {t:"长时储能", d:"持续放电 4 小时以上的储能（液流电池、压缩空气、氢储能等），用于平抑新能源多日波动，是高比例新能源电网的必备能力。"},
        {t:"源网荷储一体化", d:"将电源、电网、负荷、储能作为一个整体统筹规划运营，提升局部新能源自平衡能力的建设模式。"}
      ],
      cases:[],
      quiz:[
        {id:"s3q1", type:"choice", q:"截至 2024 年底，我国风电与光伏发电合计装机的历史性变化是？", options:["超过煤电装机，成为第一大电源","仍不足 5 亿千瓦","全部为分布式","低于水电"], answer:0, explain:"2024 年底风光合计约 14.1 亿千瓦，历史性超过煤电装机。"},
        {id:"s3q2", type:"choice", q:"以下哪种储能方式可实现跨季节储能？", options:["锂离子电池","飞轮储能","氢储能","超级电容"], answer:2, explain:"氢储能可长周期存储并再发电，适合跨天、跨季节调节；锂电/飞轮主要面向短时尺度。"},
        {id:"s3q3", type:"judge", q:"虚拟电厂需要新建实体发电机组才能参与电网调节。", options:["正确","错误"], answer:1, explain:"虚拟电厂不新建实体机组，而是数字化聚合存量可调资源参与调度与交易。"},
        {id:"s3q4", type:"choice", q:"《氢能产业发展中长期规划（2021—2035 年）》对氢能的定位是？", options:["未来国家能源体系的重要组成部分","仅限化工原料","应全面替代电力","交通专用能源"], answer:0, explain:"规划明确氢能是未来国家能源体系的重要组成部分、用能终端绿色低碳转型的重要载体。"}
      ]
    },

    /* ============ 板块四：工业与产业绿色升级 ============ */
    { id:"s4", no:"4", name:"工业与产业绿色升级", icon:"🏭",
      desc:"重点行业节能降碳改造、绿色制造体系、工业流程再造与循环经济 —— 工业是碳排放的最大来源领域",
      knowledge:[
        {t:"一、重点行业节能降碳改造（钢铁、有色、石化、建材）",
         x:"工业约占我国碳排放的 65%—70%，其中钢铁、建材、石化化工、有色是重点。政策抓手是《工业重点领域能效标杆水平和基准水平（2023 年版）》：能效低于基准水平的产能限期改造升级、达不到要求的逐步淘汰退出，标杆水平作为新建产能准入门槛。<br>钢铁行业推进全流程超低排放改造（有组织排放、无组织排放、清洁运输三环节）；电解铝鼓励使用绿电从源头降低电力间接排放；水泥执行错峰生产并推广替代燃料。全国碳市场扩容正逐步覆盖钢铁、水泥、电解铝等行业，用碳价倒逼改造。"},
        {t:"二、绿色制造体系建设（绿色工厂、绿色供应链）",
         x:"绿色制造体系以「绿色工厂—绿色工业园区—绿色供应链管理企业」为三大载体，国家级绿色工厂累计已培育数千家。绿色工厂评价指标涵盖：基础设施、管理体系、能源资源投入、产品、环境排放、绩效六大维度；<br>绿色供应链要求核心企业带动上下游协同降碳（供应商碳核查、绿色采购、物流优化）。2024 年起实行梯度培育与动态管理机制，有进有出，防止「一评定终身」。企业价值：绿色工厂是绿色信贷、绿色债券与政府采购的加分项，也与出口应对 CBAM 的数据能力直接相关。"},
        {t:"三、工业流程再造（电气化替代、氢能冶炼）",
         x:"对高碳工艺做「源头重构」而非「末端修补」：<br>① 终端用能电气化——工业电锅炉、电窑炉、电驱动替代燃煤燃油工艺，配合绿电实现零碳用能；<br>② 氢冶金——以绿氢替代焦炭作还原剂，从「碳还原」转向「氢还原」，国内头部钢企已建成氢冶金示范工程并投入运营；<br>③ 低碳水泥——降低熟料系数、发展地聚物等胶凝材料；<br>④ 与 CCUS 组合处理难以完全避免的工艺排放（见板块五）。流程再造投资大、周期长，需要碳价信号与绿色金融共同支撑。"},
        {t:"四、循环经济与资源利用（固废利用、动力电池回收）",
         x:"循环经济通过「材料替代与再利用」实现结构性减排：<br>① 固废综合利用——工业固废用于建材原料、生态修复与井下充填；<br>② 再生金属——再生铝、再生铜的综合能耗仅为原生金属的百分之几到百分之二十几，减排效果显著；<br>③ 动力电池回收——依据《新能源汽车动力电池回收利用溯源管理暂行规定》建立全生命周期溯源体系，落实生产者责任延伸制度，梯次利用（储能、备电）优先、再生利用兜底；<br>④ 再制造——旧件修复性能达到或超过新品。考核要点：主要资源产出率、大宗固废综合利用率是循环经济的核心指标。"}
      ],
      terms:[
        {t:"超低排放改造", d:"钢铁企业对烧结、球团等环节实施更严格于特别排放限值的全流程治理改造，涵盖有组织排放、无组织排放与清洁运输三方面。"},
        {t:"能效标杆水平 / 基准水平", d:"标杆水平为行业能效「领跑者」值，基准水平为准入底线；低于基准水平的产能须改造升级或退出。"},
        {t:"再生金属", d:"以废旧金属为原料重熔加工的金属产品，能耗与碳排放远低于原生冶炼，是「城市矿山」开发的核心。"},
        {t:"生产者责任延伸（EPR）", d:"生产者对产品全生命周期的资源环境责任延伸至消费后环节，典型如动力电池生产者承担回收主体责任。"}
      ],
      cases:[],
      quiz:[
        {id:"s4q1", type:"choice", q:"判定工业产能是否需要节能降碳改造的核心依据是？", options:["能效与标杆/基准水平的对比","建厂时间早晚","企业所有制","地理位置"], answer:0, explain:"以《工业重点领域能效标杆水平和基准水平》为标尺：低于基准限期改造，标杆水平作为新建准入。"},
        {id:"s4q2", type:"judge", q:"氢冶金以绿氢替代焦炭作还原剂，可将炼铁从「碳还原」转变为「氢还原」。", options:["正确","错误"], answer:0, explain:"氢冶金以 H₂ 替代碳作还原剂，副产物为水，是钢铁深度脱碳的流程再造路线。"},
        {id:"s4q3", type:"choice", q:"动力电池回收利用的优先次序是？", options:["梯次利用优先、再生利用兜底","直接填埋","全部出口","拆解后焚烧"], answer:0, explain:"先评估残液容量做梯次利用（储能/备电），无法梯次利用的再拆解做资源化再生。"},
        {id:"s4q4", type:"judge", q:"国家级绿色工厂评定后终身有效，无需动态管理。", options:["正确","错误"], answer:1, explain:"2024 年起实行梯度培育与动态管理，有进有出，不搞「一评定终身」。"}
      ]
    },

    /* ============ 板块五：低碳技术与科技创新 ============ */
    { id:"s5", no:"5", name:"低碳技术与科技创新", icon:"🔬",
      desc:"CCUS、负排放技术与数字化碳管理 —— 支撑难减排行业深度脱碳的「技术兜底」",
      knowledge:[
        {t:"一、CCUS（碳捕集、利用与封存）",
         x:"CCUS 是 CO₂ 捕集、输送、利用与封存的全链条技术，是钢铁、水泥、化工等难减排行业实现近零排放的「兜底」选项。四个环节：<br>① 捕集——燃烧后胺法吸收为当前主流，捕集能耗与成本是主要瓶颈；<br>② 输送——管道与低温槽车；<br>③ 利用——CO₂ 驱油（EOR）、制化学品（甲醇、可降解塑料）、矿化养护混凝土；<br>④ 封存——陆上/海上咸水层地质封存。标志性工程：齐鲁石化—胜利油田百万吨级 CCUS 项目于 2022 年投运，是我国首个全链条百万吨级项目。定位提示：CCUS 优先用于「必须排放」的工艺环节，不能成为延缓新能源替代的借口。"},
        {t:"二、负排放技术（DAC 直接空气捕集）",
         x:"负排放技术从大气中直接移除 CO₂，用于对冲难以消除的残余排放，是「净零」中「净」字的技术支撑。主要路线：<br>① DAC（直接空气捕集）——用吸附剂从空气中捕获 CO₂，因浓度低（约 0.04%）能耗与成本显著高于点源捕集，当前成本仍在每吨数百美元量级，代表工程如冰岛 Climeworks 的 Orca 与 Mammoth；<br>② BECCS——生物质发电/供热叠加碳捕集，兼具能源产出与负排放；<br>③ 增强风化、生物炭、土壤碳汇等自然与半自然路线。共同要点：需要长期稳定封存（地质封存或矿物碳酸盐化）并配套高水平监测、报告与核查（MRV），才能形成可信的「碳移除」资产。"},
        {t:"三、数字化碳管理（EMS 能源管理系统、碳足迹追踪）",
         x:"数字化是碳管理从「年度核算」走向「实时治理」的关键：<br>① EMS 能源管理系统——水、电、气、热三级计量与在线监测，发现跑冒滴漏与错峰优化空间；<br>② 产品碳足迹——从原料、生产、运输到使用回收的全生命周期核算，对接产品碳足迹数据库；欧盟《新电池法》已要求动力电池分阶段提供碳足迹声明与等级标签，出口企业必须具备批次级数据能力；<br>③ 智能优化——数字孪生仿真工艺能耗、AI 优化设备启停与调度；<br>④ 可信溯源——区块链用于绿电绿证、再生材料与碳资产的全链条溯源。企业侧建议：先建「数据底座」（计量体系+组织边界），再上「智能应用」。"}
      ],
      terms:[
        {t:"CO₂ 驱油（EOR）", d:"将捕集的 CO₂ 注入油藏提高采收率，同时实现 CO₂ 地下封存，「利用即封存」的典型方式。"},
        {t:"BECCS", d:"生物质能结合碳捕集与封存：植物生长吸碳、能源化利用后捕集封存，全链条形成负排放。"},
        {t:"DAC", d:"直接空气捕集（Direct Air Capture），以化学吸附/吸收方式从环境大气中直接捕获 CO₂ 的负排放技术。"},
        {t:"电池护照", d:"欧盟《新电池法》要求的电池数字档案，涵盖碳足迹、材料成分与供应链信息，倒逼出口企业建立数据体系。"}
      ],
      cases:[],
      quiz:[
        {id:"s5q1", type:"choice", q:"我国首个全链条百万吨级 CCUS 项目是？", options:["齐鲁石化—胜利油田项目","大庆油田项目","塔里木项目","海南洋浦项目"], answer:0, explain:"齐鲁石化—胜利油田百万吨级 CCUS 项目 2022 年投运，覆盖捕集、输送、利用（驱油）与封存全链条。"},
        {id:"s5q2", type:"judge", q:"DAC 直接空气捕集的成本显著低于电厂烟气捕集。", options:["正确","错误"], answer:1, explain:"大气 CO₂ 浓度仅约 0.04%，远低于烟气（10% 以上），DAC 能耗与成本反而更高。"},
        {id:"s5q3", type:"choice", q:"企业推进数字化碳管理的合理第一步是？", options:["先建计量与数据底座","直接购买碳中和证书","立即关停产线","只做宣传物料"], answer:0, explain:"先建立三级计量与组织边界的数据底座，再叠加智能分析与优化应用。"}
      ]
    },

    /* ============ 板块六：生态碳汇与基于自然的解决方案 ============ */
    { id:"s6", no:"6", name:"生态碳汇与基于自然的解决方案", icon:"🌳",
      desc:"林业碳汇开发经营、海洋蓝碳、生态系统保护修复与增汇 —— 「吸」的主线与生态产品价值实现",
      knowledge:[
        {t:"一、林业碳汇开发与经营",
         x:"林业碳汇分「造林/再造林」与「森林经营」两大方向：前者通过新造林地新增固碳，后者通过抚育间伐、补植改造提升存量林分固碳能力。项目开发核心概念：<br>① 土地合格性——项目土地须符合所选方法学对基线土地利用的规定（如全国 CCER 造林碳汇方法学对 2012 年以来无林地等要求）；<br>② 额外性——无碳收益激励时项目不会发生；<br>③ 碳层划分与抽样实测——以「可测量、可报告、可核查（MRV）」为原则布设样地；<br>④ 计入期与非持久性——森林存在火灾、病虫害风险，需动态监测与扣减。开发实务与政策依据详见「板块二 → 03 CCER 自愿减排方法学」的方法学速览。"},
        {t:"二、海洋蓝碳探索",
         x:"海洋蓝碳指由红树林、滨海盐沼、海草床等海岸带生态系统固定并埋藏的碳，其单位面积固碳速率普遍高于陆地森林，且可长期埋藏于沉积物中。制度化进展：国家 CCER 机制已发布红树林营造方法学（2023 年 10 月），其后又发布滨海盐沼、海草床相关方法学，蓝碳项目正式具备国家核证交易通道。实践案例：广东湛江红树林造林项目完成全国首例蓝碳碳汇交易（2021 年）。地方层面，多地在蓝色碳核算、蓝碳方法学本地化与「蓝色碳票」上开展试点。<br>观察要点：基线判定、盐度水文条件与长期监测是蓝碳项目计量的难点。"},
        {t:"三、生态系统保护修复与增汇",
         x:"基于自然的解决方案（NbS）强调「保护优先、自然恢复为主」：<br>① 空间格局——以国家公园为主体的自然保护地体系，实施山水林田湖草沙一体化保护和修复工程（「山水工程」）；<br>② 增汇措施——科学开展大规模国土绿化、退耕还林还草还湿、草原禁牧休息与草畜平衡、湿地保护修复；<br>③ 制度支撑——自然资源部等部门印发的《生态系统碳汇能力巩固提升实施方案》明确了巩固与提升两条线；<br>④ 价值实现——GEP（生态系统生产总值）核算、生态补偿、碳汇权属与交易衔接，让「绿水青山」通过碳市场与生态补偿转化为「金山银山」。"}
      ],
      terms:[
        {t:"额外性", d:"项目减排量相对于基线情景具有「非常规、依赖碳收益才能实现」的性质，是碳汇/减排项目合格性判定的核心。"},
        {t:"蓝碳", d:"红树林、盐沼、海草床等海洋与海岸带生态系统吸收固定并长期埋藏的碳。"},
        {t:"GEP", d:"生态系统生产总值，衡量一定区域生态系统为人类福祉提供的最终产品与服务价值的总和。"},
        {t:"碳层划分", d:"按林分类型、龄组、立地等因子把项目区划分为若干相对均质的层，分层布设样地以提高计量精度、降低核查成本。"}
      ],
      cases:[],
      quiz:[
        {id:"s6q1", type:"choice", q:"下列哪组属于三大海洋蓝碳生态系统？", options:["红树林、滨海盐沼、海草床","珊瑚礁、红树林、海带","滩涂、盐田、渔排","海草床、芦苇、稻田"], answer:0, explain:"红树林、滨海盐沼与海草床是国际公认的三大海岸带蓝碳生态系统。"},
        {id:"s6q2", type:"judge", q:"森林碳汇项目存在火灾、病虫害导致的非持久性风险，需要持续监测。", options:["正确","错误"], answer:0, explain:"森林碳汇具有非持久性，须通过动态监测、风险扣减与更新计入期管理保障减排量可信。"},
        {id:"s6q3", type:"choice", q:"「山水工程」指的是？", options:["山水林田湖草沙一体化保护和修复工程","水利发电工程","旅游景区建设","退耕还林单一工程"], answer:0, explain:"「山水工程」是实施基于自然解决方案、巩固提升生态系统碳汇能力的标志性空间治理工程。"}
      ]
    },

    /* ============ 板块七：绿色金融与投资 ============ */
    { id:"s7", no:"7", name:"绿色金融与投资", icon:"💰",
      desc:"转型金融与绿色信贷、碳中和债券与基金、气候投融资试点 —— 为双碳配置「真金白银」",
      knowledge:[
        {t:"一、转型金融与绿色信贷",
         x:"我国绿色贷款余额居全球首位（已超 30 万亿元）。制度基石是目录：绿色信贷执行《绿色低碳转型产业指导目录（2024 年版）》等口径，覆盖节能环保、清洁生产、清洁能源、生态环境、基础设施绿色升级与绿色服务六大类。<br>与「绿色金融」聚焦「纯绿」活动不同，转型金融面向高碳行业「有序转型」——2022 年 G20 公布转型金融高级别原则后，中国人民银行组织在钢铁、煤电、建筑建材、农业等领域开展转型金融标准研制，核心工具是「转型计划+关键绩效指标（KPI）+信息披露」：企业须证明融资用于可信的减碳路径而非延续高碳产能。<br>对企业的建议：先建立与碳目标挂钩的转型规划，再谈融资工具选择。"},
        {t:"二、碳中和债券与基金",
         x:"① 碳中和债——2021 年 3 月在银行间与交易所市场推出，是绿色债券中募集资金专项用于碳减排项目的「贴标子品种」，投向须满足碳减排效果可量化、可核查；<br>② 绿色债券体系——含贴标绿债、可持续发展挂钩债券（SLB，票面利率与企业 KPI 达标情况挂钩）；<br>③ 基金——2020 年设立的国家绿色发展基金（首期规模 885 亿元）发挥引导作用，带动社会资本投向污染治理与碳减排领域；各类绿色产业基金、ESG 主题公募基金为二级市场配置渠道。要点：绿色债券须防止「洗绿」，募集资金托管、闲置资金比例与存续期披露是监管重点。"},
        {t:"三、气候投融资试点",
         x:"2022 年 8 月，生态环境部等九部门公布 23 个气候投融资试点（覆盖北京、上海、深圳、武汉等城市与新区）。试点的核心任务：<br>① 建立地方气候投资项目库与项目筛选标准；<br>② 探索气候信息披露与碳核算协同；<br>③ 创新工具——碳资产质押贷款、碳回购、碳基金、与碳绩效挂钩的利率定价等；<br>④ 以减污降碳协同为项目遴选主线。全国碳市场的金融化探索（碳期货等衍生品）坚持审慎推进、服务履约与风险可控的定位。观察指标：试点地区气候投融资项目库入库项目数与融资规模。"}
      ],
      terms:[
        {t:"转型金融", d:"支持高碳行业向低碳有序转型的金融服务，与聚焦「纯绿」活动的绿色金融互补，强调可信转型计划与 KPI 考核。"},

  /* ---------- 模块三：情景模拟 ---------- */
  scenarios: {

      { id:"acc1", title:"例1 · 离散制造企业", intro:"某虚拟制造企业 2025 年能耗如下，请根据排放因子计算其年度 CO₂ 总排放量（单位：吨 CO₂）。可切换电网区域观察差异。",
        inputs:[

      { id:"acc2", title:"例2 · 数据中心", intro:"某数据中心 2025 年运行能耗如下，请计算其年度 CO₂ 总排放量，并思考 PUE 与绿电采购的影响。",

            reflect:"学习思考：当“不行动的成本”随碳价逐年上升，看似省钱的维持方案其实最贵。"},
          {text:"部分改购绿电 + 屋顶光伏 30%", emission:"年排放降至约 4.2 万吨，降约 35%", good:true, level:"good", result:"用绿电与自发光伏替代，碳成本下降、获得绿色订单，投资回收期约 4–5 年。",
            reflect:"学习思考：用‘绿电 + 自发’组合，既是减排也是竞争力，回收期决定可行性。"},
          {text:"全部改购绿电 + 储能调峰", emission:"年排放降至约 1.8 万吨，降约 72%", good:true, level:"good", result:"深度脱碳带来显著品牌溢价与碳资产收益，但需评估绿电稳定供应与成本，适合有长期协议支撑的企业。",
            reflect:"学习思考：深度脱碳的边界在于绿色电力的‘稳定可得性’与协议保障。"}
        ]
      },
      { scene:"园区集中供热改造方案选择：",
        options:[
          {text:"继续分散小锅炉燃煤供热", emission:"效率低、排放高，环保督察风险大", good:false, level:"bad", result:"分散小锅炉能效低且污染重，面临淘汰与处罚，运营不确定性高。",
            reflect:"学习思考：落后产能的退出不是‘会不会’，而是‘何时’，越早转型成本越低。"},
          {text:"改用天然气集中供热", emission:"排放较燃煤下降约 50%", good:true, level:"mid", result:"天然气是较好的过渡燃料，排放明显降低，但仍产生 CO₂，需配合余热回收。",
            reflect:"学习思考：天然气是‘过渡’而非‘终点’，要避免形成新的锁定。"},
          {text:"生物质耦合 + 工业余热回收", emission:"近零碳供热，排放趋近于零", good:true, level:"good", result:"以生物质和余热为主，几乎不新增化石碳，是最优低碳路径，兼具成本与减排双重收益。",
            reflect:"学习思考：从‘烧燃料’转向‘用废热 + 可再生’，是系统级减排思路。"}
        ]
      },
      { scene:"某钢铁企业拟进行工艺升级，选择减排路线：",
        options:[
          {text:"维持高炉-转炉长流程", emission:"吨钢 CO₂ 约 1.8–2.3 t，行业高位", good:false, level:"bad", result:"短期投资低，但碳成本与限产风险高，难达行业能效标杆，未来履约压力大。",
            reflect:"学习思考：长流程的工艺性排放难以靠末端治理解决，需要源头替代。"},
          {text:"高炉 + CCUS 部分捕集", emission:"吨钢 CO₂ 下降约 30–40%", good:true, level:"mid", result:"在保留存量产能同时减排，适合过渡，但捕集能耗与封存成本需精细核算。",
            reflect:"学习思考：CCUS 是存量产能的‘续命 + 减排’手段，但要算清能耗与封存账。"},
          {text:"氢冶金示范线", emission:"吨钢 CO₂ 下降约 50–60%", good:true, level:"good", result:"以绿氢替代焦炭作还原剂，过程产物为水，是深度脱碳方向，需配套绿氢供应与成本下降。",
            reflect:"学习思考：氢冶金的前提是‘绿氢’——若氢来自化石能源，减排效果将大打折扣。"}
        ]
      }
    ],

        {text:"地铁/公交", co2:"约 1.2 kg", note:"公共交通人均排放极低", reflect:"学习思考：提高运载率是交通减排最朴素也最有效的杠杆。"},
        {text:"骑行/步行", co2:"0 kg", note:"零碳，还锻炼身体", reflect:"学习思考：短途出行‘非机动化’是零成本减排。"}
      ]},
      { scene:"一顿正餐的蛋白质来源，哪种更低碳？", options:[

        {text:"鸡肉/猪肉", co2:"约 1.8 kg", note:"禽类碳足迹明显低于牛", reflect:"学习思考：蛋白质来源的‘碳差’可达数倍，饮食结构是关键变量。"},
        {text:"豆制品/蔬菜", co2:"约 0.5 kg", note:"植物蛋白碳足迹最低", reflect:"学习思考：植物基饮食不仅低碳，还能降低土地与水压力。"}
      ]},
      { scene:"买一件新衣服 vs 闲置衣橱里翻新？", options:[
        {text:"网购一件新快时尚上衣", co2:"约 10–15 kg", note:"生产+运输+包装全链条排放", reflect:"学习思考：快时尚的‘低价’未计入环境与碳成本。"},
        {text:"旧衣改造/二手交易", co2:"约 0.5 kg", note:"延长使用寿命，减排显著", reflect:"学习思考：延长使用寿命 1 倍，相当于分摊掉一半的制造排放。"},
        {text:"循环租赁/共享", co2:"约 1 kg", note:"提高单件利用率，分摊排放", reflect:"学习思考：从‘拥有’转向‘使用’，是循环经济的减排逻辑。"}
      ]},

        {text:"26℃ + 定时 + 风扇辅助", co2:"约 110 kg/月", note:"合理设定 + 风扇可减负荷", reflect:"学习思考：行为节能零成本，是家庭减排的第一杠杆。"},
        {text:"自然通风为主、空调间歇使用", co2:"约 70 kg/月", note:"结合遮阳与通风，负荷最低", reflect:"学习思考：被动式设计（遮阳、通风）比主动制冷更低碳。"}
